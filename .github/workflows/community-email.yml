name: Community email
run-name: Community email checks or queue processing
on:
  push:
    paths:
      - 'projects/community-email/**'
      - '.github/workflows/community-email.yml'
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Unit tests
        run: bash projects/community-email/run.sh test
      - name: Install compiler without lifecycle scripts
        run: npm ci --prefix projects/community-email/config --ignore-scripts --no-audit --no-fund
      - name: Compile synthetic email
        run: bash projects/community-email/run.sh compile

  generate:
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && needs.checks.result == 'success'))
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: community-email
    env:
      COMMUNITY_EMAIL_ENABLED: 'true'
    concurrency:
      group: community-email-generation
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install locked compiler before fetching secrets
        run: npm ci --prefix projects/community-email/config --ignore-scripts --no-audit --no-fund
      - name: Verify worker before reading private content
        run: |
          bash projects/community-email/run.sh test
          bash projects/community-email/run.sh compile
      - name: Fetch only email connection settings from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_SECRET }}
          project-slug: scla-projects-n-joy
          env-slug: dev
          secret-path: /
          recursive: false
          include-imports: false
          export-type: env
      - name: Check private Notion requests and refresh same-page code
        run: bash projects/community-email/run.sh generate
