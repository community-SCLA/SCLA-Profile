name: Community email approved root check
on:
  push:
    paths:
      - '.github/workflows/community-email-root-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read explicitly approved Infisical project root
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_SECRET }}
          project-slug: scla-projects-n-joy
          env-slug: dev
          secret-path: /
          recursive: false
          include-imports: false
          export-type: env
      - name: Report expected names without values
        shell: python
        run: |
          import os
          candidates = (
              "SCLA_EMAIL_NOTION_TOKEN",
              "SCLA_NOTION_TOKEN",
              "NOTION_TOKEN",
              "NOTION_API_KEY",
              "SCLA_EMAIL_SOURCE_PAGE_ID",
              "SCLA_EMAIL_QUEUE_DATA_SOURCE_ID",
          )
          present = [name for name in candidates if os.environ.get(name)]
          print("Present expected names: " + (", ".join(present) if present else "none"))
