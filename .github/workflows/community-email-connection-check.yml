name: Community email connection check
on:
  push:
    paths:
      - '.github/workflows/community-email-connection-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read only the community email folder
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_SECRET }}
          project-slug: scla-projects-n-joy
          env-slug: dev
          secret-path: /community-email
          recursive: false
          include-imports: false
          export-type: env
      - name: Verify required names without printing values
        shell: python
        run: |
          import os
          required = (
              "SCLA_EMAIL_NOTION_TOKEN",
              "SCLA_EMAIL_SOURCE_PAGE_ID",
              "SCLA_EMAIL_QUEUE_DATA_SOURCE_ID",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print("Missing required names: " + ", ".join(missing))
              raise SystemExit(1)
          print("All required community email names are available.")
