      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          var COLS = 12;
          var ROWS = 4;
          var COL_PITCH = 120;
          var ROW_PITCH = 104;

          /* The sixteen clue marks Act 2 lit, in the cells Act 2 left them in.
             This act only ever MOVES them — the field is never rebuilt. */
          var GOLD = [
            [1, 0], [4, 2], [7, 1], [10, 3],
            [2, 3], [5, 0], [8, 2], [11, 1],
            [0, 2], [3, 1], [6, 3], [9, 0],
            [2, 1], [5, 3], [8, 0], [11, 2]
          ];
          var goldIdx = GOLD.map(function (g) {
            return g[1] * COLS + g[0];
          });

          var field = document.getElementById("cn-field");
          var marks = [];
          for (var r = 0; r < ROWS; r++) {
            for (var c = 0; c < COLS; c++) {
              var n = r * COLS + c;
              var m = document.createElement("div");
              m.className = "mk " + (goldIdx.indexOf(n) === -1 ? "mk-dim" : "mk-lit");
              m.id = "cn-m" + n;
              m.style.left = c * COL_PITCH + "px";
              m.style.top = r * ROW_PITCH + "px";
              field.appendChild(m);
              marks.push(m);
            }
          }
          for (var q = 0; q < ROWS; q++) {
            var rule = document.createElement("div");
            rule.className = "cn-rule";
            rule.id = "cn-r" + q;
            rule.style.top = q * ROW_PITCH + 22 + "px";
            field.appendChild(rule);
          }

          /* The re-sort is a PERMUTATION: every clue mark that is not already in
             the left block trades places with the mark standing in the cell it
             wants. Forty-eight marks in, forty-eight marks out, no cell empty
             and no cell doubled. */
          var targets = [];
          for (var tr = 0; tr < 4; tr++) {
            for (var tc = 0; tc < 4; tc++) targets.push([tc, tr]);
          }
          var targetIdx = targets.map(function (t) {
            return t[1] * COLS + t[0];
          });
          var movers = [];
          for (var g = 0; g < GOLD.length; g++) {
            if (targetIdx.indexOf(goldIdx[g]) === -1) movers.push(GOLD[g]);
          }
          var vacancies = [];
          for (var v = 0; v < targets.length; v++) {
            if (goldIdx.indexOf(targetIdx[v]) === -1) vacancies.push(targets[v]);
          }

          var tl = gsap.timeline({ paused: true });
          var IN = "power3.out";
          var OUT = "power2.in";

          function arrive(sel, t, y, dur) {
            tl.set(sel, { opacity: 1, y: y }, t);
            tl.to(sel, { y: 0, duration: dur, ease: IN }, t);
          }
          function leave(sel, t, y) {
            tl.to(sel, { opacity: 0, y: y, duration: 0.28, ease: OUT }, t);
          }

          /* ---- s09 (audio 0.25) — how you naturally contribute.
             On the word "contribute" (1.81) the clues gather to the left. */
          arrive("#cn-h1", 0.35, 62, 0.24);
          for (var p = 0; p < movers.length; p++) {
            var from = movers[p];
            var to = vacancies[p];
            var mover = marks[from[1] * COLS + from[0]];
            var swapped = marks[to[1] * COLS + to[0]];
            var t0 = 1.71 + p * 0.028;
            tl.to(
              mover,
              {
                x: (to[0] - from[0]) * COL_PITCH,
                y: (to[1] - from[1]) * ROW_PITCH,
                duration: 0.9,
                ease: "power3.inOut"
              },
              t0
            );
            tl.to(
              swapped,
              {
                x: (from[0] - to[0]) * COL_PITCH,
                y: (from[1] - to[1]) * ROW_PITCH,
                duration: 0.9,
                ease: "power3.inOut"
              },
              t0
            );
          }

          /* ---- s10-s13 — four ways of contributing, each on its own verb:
             organizing 3.79 · analyzing 6.45 · helping 10.53 · turns 14.30.
             Each line also draws the rule beside its row of clues. */
          var WAYS = [
            { at: 3.69, id: "#cn-w1", rule: "#cn-r0" },
            { at: 6.35, id: "#cn-w2", rule: "#cn-r1" },
            { at: 10.43, id: "#cn-w3", rule: "#cn-r2" },
            { at: 14.2, id: "#cn-w4", rule: "#cn-r3" }
          ];
          for (var w = 0; w < WAYS.length; w++) {
            arrive(WAYS[w].id, WAYS[w].at, 40, 0.22);
            tl.fromTo(
              WAYS[w].rule,
              { scaleX: 0 },
              { scaleX: 1, duration: 0.7, ease: IN },
              WAYS[w].at + 0.1
            );
          }

          /* ---- s14 (audio 16.57) — built from repeated clues ("repeated" 19.55). */
          leave("#cn-h1", 19.45, -44);
          arrive("#cn-h2", 19.77, 58, 0.24);

          /* ---- s15 (audio 21.08) — not a forever path ("forever" 23.26), but
             what fits right now ("more" 24.64). */
          for (var x = 0; x < WAYS.length; x++) {
            leave(WAYS[x].id, 21.2 + x * 0.05, -30);
            tl.to(WAYS[x].rule, { opacity: 0, duration: 0.3, ease: OUT }, 21.2 + x * 0.05);
          }
          tl.set("#cn-close", { opacity: 1 }, 22.6);
          arrive("#cn-less", 23.16, 44, 0.22);
          arrive("#cn-more", 24.54, 48, 0.24);

          window.__timelines["contribute"] = tl;
        })();
