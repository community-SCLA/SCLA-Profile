      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a1e2f;
      }
      body {
        font-family: "Proxima Nova", system-ui, sans-serif;
      }

      /* The page fill is never on the root itself — the producer's frame
         compositing can drop a background set on the root element and render
         the frame black. #bg is the full-bleed child that carries it. */
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: "Proxima Nova", system-ui, sans-serif;
        color: #ffffff;
      }

      #bg {
        position: absolute;
        inset: 0;
        background: #0a1e2f;
      }
      /* Radial, never linear: a full-frame linear ramp on navy bands under H.264. */
      #bg-glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 1180px 700px at 50% 58%,
          rgba(13, 36, 55, 0.98),
          rgba(10, 30, 47, 0) 72%
        );
        transform-origin: 50% 58%;
      }
      /* 120px hairline grid at 5% — far below the ink gate's local-contrast
         threshold by construction, so it reads as texture, never as content. */
      #bg-grid {
        position: absolute;
        inset: 0;
        background-image: repeating-linear-gradient(
            to right,
            rgba(51, 147, 214, 0.05) 0 1px,
            rgba(51, 147, 214, 0) 1px 120px
          ),
          repeating-linear-gradient(
            to bottom,
            rgba(51, 147, 214, 0.05) 0 1px,
            rgba(51, 147, 214, 0) 1px 120px
          );
      }

      /* Program chrome. Sits inside the declared chrome rectangle
         (tokens.yml chrome-regions: 100,50,700,110) and nowhere else. */
      #chrome {
        position: absolute;
        left: 120px;
        top: 56px;
        height: 40px;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      #chrome-mark {
        display: block;
        width: 8px;
        height: 28px;
        background: #eaab2d;
      }
      #chrome-text {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #3393d6;
      }

      /* Act slots fill the frame. */
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>

    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        var tl = gsap.timeline({ paused: true });

        /* The build's ONLY repeating tween: one slow breath on the background
           radial lift. 8s half-period, finite repeat 18 = 152s, inside the
           154.227s root duration (never ceil past it). */
        tl.fromTo(
          /* motion-allow: background radial lift is the frame's single ambient
             layer, never content. Declared INSIDE the call because check_motion
             matches the tween text itself — a declaration above the call is
             invisible to it. */
          "#bg-glow",
          { scale: 1, opacity: 0.94 },
          { scale: 1.05, opacity: 1, duration: 8, ease: "sine.inOut", yoyo: true, repeat: 18 },
          0
        );

        window.__timelines["main"] = tl;
      })();
