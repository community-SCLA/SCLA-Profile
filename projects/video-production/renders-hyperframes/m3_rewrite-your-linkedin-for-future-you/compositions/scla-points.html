<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"label","type":"string","label":"Section label","default":"[[label]]"},
    {"id":"heading","type":"string","label":"Heading","default":"[[heading]]"},
    {"id":"point1","type":"string","label":"Point 1","default":"[[point1]]"},
    {"id":"point2","type":"string","label":"Point 2","default":"[[point2]]"},
    {"id":"point3","type":"string","label":"Point 3","default":"[[point3]]"},
    {"id":"point4","type":"string","label":"Point 4 (empty to hide)","default":"[[point4]]"},
    {"id":"sceneIndex","type":"string","label":"Scene index label","default":"02 / KEY POINTS"},
    {"id":"theme","type":"string","label":"Style package (summit | horizon | cadence)","default":"summit"},
    {"id":"subBeats","type":"string","label":"Sub-beats — narration-synced live line, pipe-separated (empty = off)","default":""},
    {"id":"subCues","type":"string","label":"Per-sub-beat reveal times, local sec, comma-separated (compiler-owned)","default":""},
    {"id":"sceneDuration","type":"string","label":"Scene duration in seconds (compiler-maintained; times the late-phase resolve)","default":"10"},
    {"id":"pointCues","type":"string","label":"Per-point reveal times, local sec, comma-separated (empty = default spread)","default":""}
  ]'
>
  <!-- No per-row icon slot. Icons beside bullet rows were REMOVED 2026-07-29 on
       owner instruction ("icons should not render to the right of bullet
       points"), following the ripple precedent: remove the capability rather
       than police it. The rail drew a ~64px glyph at each row's right edge; in
       practice it rendered on SOME rows and not others (`icons=",insight,"`),
       and twice drew two near-identical person glyphs in one frame
       (`mentorship` + `mentorship2`). A single hero `icon` on the
       statement/chips/steps/condition families is unaffected. Re-adding an
       `icons` slot fails check_slots.py rule `banned-row-icons`. -->
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "proxima-nova"; src: url("assets/fonts/proxima-nova-400.woff2") format("woff2"); font-weight: 400; font-style: normal; }
        @font-face { font-family: "proxima-nova"; src: url("assets/fonts/proxima-nova-700.woff2") format("woff2"); font-weight: 700; font-style: normal; }
        @font-face { font-family: "proxima-nova"; src: url("assets/fonts/proxima-nova-900.woff2") format("woff2"); font-weight: 900; font-style: normal; }
      </style>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "proxima-nova", system-ui, sans-serif;
        }
        .kp-bg {
          position: absolute;
          inset: 0;
          background: #f6f6f9;
          background-image:
            linear-gradient(rgba(51, 147, 214, 0.07) 1px, transparent 1px),
            linear-gradient(90deg, rgba(51, 147, 214, 0.07) 1px, transparent 1px);
          background-size: 120px 120px;
        }
        #kp-ghost-ring {
          position: absolute;
          left: -320px;
          bottom: -380px;
          width: 900px;
          height: 1020px;
          border-radius: 50%;
          border: 3px solid rgba(51, 147, 214, 0.16);
        }
        #kp-ghost-ring-2 {
          position: absolute;
          left: -220px;
          bottom: -300px;
          width: 660px;
          height: 780px;
          border-radius: 50%;
          border: 2px solid rgba(234, 171, 45, 0.2);
        }
        /* Rail + label pulled inside the 72px keep-out (2026-07-29): at right:44
           the vertical label's outer edge sat at x=1876, 28px into the band
           tokens.yml declares a HARD no-content zone. Nothing had ever measured a
           vertical run, so it read as compliant. check_geometry.py measures it. */
        #kp-rail {
          position: absolute;
          right: 116px;
          top: 120px;
          bottom: 120px;
          width: 2px;
          background: #cccedf;
          transform-origin: center top;
        }
        #kp-rail-label {
          position: absolute;
          right: 76px;
          top: 120px;
          font-size: 20px;
          font-weight: 700;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: #5f6f96;
          writing-mode: vertical-rl;
        }
        #kp-head {
          position: absolute;
          left: 120px;
          top: 110px;
          width: 1400px;
        }
        #kp-label-row {
          display: flex;
          align-items: center;
          gap: 18px;
        }
        #kp-tick {
          width: 46px;
          height: 4px;
          background: #eaab2d;
          transform-origin: left center;
        }
        #kp-label {
          font-size: 24px;
          font-weight: 700;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: #3393d6;
        }
        #kp-heading {
          margin-top: 18px;
          font-size: 68px;
          font-weight: 900;
          color: #0d2437;
          line-height: 1.08;
        }
        #kp-list {
          position: absolute;
          left: 120px;
          top: 370px;
          width: 1480px;
          display: flex;
          flex-direction: column;
        }
        .kp-item {
          display: flex;
          align-items: center;
          gap: 36px;
          padding: 30px 0;
          border-bottom: 2px solid #cccedf;
        }
        /* text-floor-exempt: marker numeral sized by its 74px circle, not body copy */
        .kp-num {
          flex: none;
          width: 74px;
          height: 74px;
          border-radius: 50%;
          background: #eaab2d;
          color: #0d2437;
          font-size: 32px;
          font-weight: 900;
          display: grid;
          place-items: center;
        }
        .kp-text {
          font-size: 40px;
          font-weight: 400;
          color: #292f35;
        }
        /* Closing-beat rule (Motion v2, 2026-07-27) — completes under the heading in
           the scene's final second. scaleX(0) at rest so it is invisible pre-beat. */
        #kp-close-rule { margin-top: 18px; width: 240px; height: 4px; background: #eaab2d; transform: scaleX(0); transform-origin: left center; }
        #kp-index {
          position: absolute;
          right: 120px;
          bottom: 58px;
          font-size: 20px;
          font-weight: 700;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: #5f6f96;
        }
        /* Sub-beats — narration-synced live line (dead-hold fix, 2026-07-14).
           One beat visible at a time; absent unless subBeats is set. */
        #kp-subbeat-host {
          /* The sub-beat's containing block must be the FRAME. This host was
             unstyled, so the `bottom` below resolved against whichever
             absolutely-positioned wrapper happened to enclose it — putting
             every sub-beat ABOVE the frame (y=-180 here, y=-222 on
             scla-chips). That is not a prototype-only artifact: the run-time
             lines appended to this host inherit the same containing block, so
             real sub-beats rendered out of place too, which is how scla-loop's
             sub-beat landed on a caption on 2026-07-29. Two build agents
             worked around it by abandoning subBeats; the defect belongs here,
             once, rather than in every scene plan that wants a sub-beat. */
          position: absolute;
          inset: 0;
          pointer-events: none;
        }

        /* Sub-beat sits directly UNDER THE HEADING, not at the frame bottom
           (owner, 2026-07-29: "the body statement that populates at the bottom
           should really live up below the statement heading", said of two
           frames in one review). A bottom-anchored live line reads as a caption
           bolted onto the slide; the same sentence under the heading reads as
           the heading's second breath, which is what the narration is doing at
           that moment. The content band below is unaffected — chips start at
           470 / rows at 370, and check_geometry grades the gap. */
        .kp-subbeat {
          position: absolute;
          left: 120px;
          right: 200px;
          top: 272px;
          text-align: left;
          font-size: 40px;
          font-weight: 700;
          color: #5f6f96;
          opacity: 0;
        }
        /* Style packages (design-contract.md "Style packages") — visual layer only; timeline identical */
        #root[data-theme="horizon"] .kp-bg { background: #ffffff; background-image: radial-gradient(rgba(51, 147, 214, 0.12) 2px, transparent 2px); background-size: 72px 72px; }
        #root[data-theme="horizon"] #kp-ghost-ring { left: auto; bottom: auto; right: -320px; top: -420px; border-color: rgba(51, 147, 214, 0.14); }
        #root[data-theme="horizon"] #kp-ghost-ring-2 { left: auto; bottom: auto; right: -200px; top: -320px; border-color: rgba(234, 171, 45, 0.16); }
        #root[data-theme="horizon"] #kp-tick { background: #3393d6; }
        #root[data-theme="horizon"] #kp-close-rule { background: #3393d6; }
        #root[data-theme="horizon"] .kp-num { background: #ffffff; border: 3px solid #3393d6; color: #0d2437; }
        #root[data-theme="cadence"] .kp-bg { background: #ffffff; background-image: linear-gradient(rgba(51, 147, 214, 0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(51, 147, 214, 0.09) 1px, transparent 1px); background-size: 96px 96px; }
        #root[data-theme="cadence"] #kp-tick { width: 70px; }
        #root[data-theme="cadence"] #kp-close-rule { width: 300px; }
        #root[data-theme="cadence"] .kp-num { background: #0d2437; color: #eaab2d; }
        #root[data-theme="cadence"] #kp-rail { background: #eaab2d; }
        #root[data-theme="cadence"] .kp-item { border-bottom-color: #e5eff6; }
      </style>

      <div id="root" data-composition-id="scla-points" data-width="1920" data-height="1080" data-duration="8">
        <div class="kp-bg"></div>
        <div id="kp-ghost-ring" data-layout-allow-overflow></div>
        <div id="kp-ghost-ring-2" data-layout-allow-overflow></div>
        <div id="kp-rail"></div>
        <div id="kp-rail-label">SCLA · Lesson System</div>
        <div id="kp-head">
          <div id="kp-label-row">
            <div id="kp-tick"></div>
            <div id="kp-label">Why decisions feel hard</div>
          </div>
          <h2 id="kp-heading">Four pressure traps</h2>
          <div id="kp-close-rule"></div>
        </div>
        <div id="kp-list">
          <div class="kp-item" id="kp-item-1">
            <div class="kp-num">1</div>
            <div class="kp-text" id="kp-text-1">Deciding under pressure</div>
          </div>
          <div class="kp-item" id="kp-item-2">
            <div class="kp-num">2</div>
            <div class="kp-text" id="kp-text-2">Comparing yourself to others</div>
          </div>
          <div class="kp-item" id="kp-item-3">
            <div class="kp-num">3</div>
            <div class="kp-text" id="kp-text-3">Fixating on one factor, like salary or prestige</div>
          </div>
          <div class="kp-item" id="kp-item-4">
            <div class="kp-num">4</div>
            <div class="kp-text" id="kp-text-4">Staying the course only because of sunk costs</div>
          </div>
        </div>
        <!-- Static append target for cued sub-beats. Appending to #root by id is unsafe:
             every scene's template root is id="root", so in the composited render
             getElementById("root") resolves to the FIRST scene's root (see the
             scla-chips subBeat root-cause note, fixed 2026-07-27). -->
        <div id="kp-subbeat-host">
          <!-- Geometry declaration for the sub-beat lines the script creates at
               run time: empty and opacity:0, so it paints nothing. It exists so
               check_geometry.py can see the box those lines occupy. A box only
               the browser knows about is a box no gate can grade — which is how
               scla-loop's sub-beat landed on a caption on 2026-07-29. -->
          <div class="kp-subbeat" id="kp-subbeat-proto" data-slot="subBeats" data-geometry-proto></div>
        </div>
        <div id="kp-index">02 / KEY POINTS</div>
      </div>

      <script>
        (function () {
          const defaults = {
            label: "Why decisions feel hard",
            heading: "Four pressure traps",
            point1: "Deciding under pressure",
            point2: "Comparing yourself to others",
            point3: "Fixating on one factor, like salary or prestige",
            point4: "Staying the course only because of sunk costs",
            sceneIndex: "02 / KEY POINTS",
            theme: "summit",
            pointCues: "",
            sceneDuration: "10",
          };
          const vars = Object.assign(
            {},
            defaults,
            window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {},
          );
          document.getElementById("root").setAttribute("data-theme", vars.theme || "summit");
          document.getElementById("kp-label").textContent = vars.label;
          document.getElementById("kp-heading").textContent = vars.heading;
          document.getElementById("kp-index").textContent = vars.sceneIndex;
          const points = [vars.point1, vars.point2, vars.point3, vars.point4];
          points.forEach(function (p, i) {
            const item = document.getElementById("kp-item-" + (i + 1));
            if (p && String(p).trim() !== "") {
              document.getElementById("kp-text-" + (i + 1)).textContent = p;
            } else {
              item.remove();
            }
          });

          // No living-icon library here by design (2026-07-29). This template
          // renders bullet rows, and the owner banned icons beside bullet rows;
          // keeping the map around would just invite the slot back.

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });
          const sceneDur = Math.max(4, Number(vars.sceneDuration) || 10);
          // Entrance settles ≤1.2s (Motion v2, 2026-07-27): hero tweens ≤0.6s,
          // relative order/stagger feel preserved from the v1 choreography.
          tl.fromTo("#kp-tick", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.1);
          tl.fromTo("#kp-label", { opacity: 0, x: -32 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.15);
          tl.fromTo("#kp-heading", { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.6, ease: "power4.out" }, 0.3);
          tl.fromTo("#kp-rail", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power2.out" }, 0.15);
          tl.fromTo("#kp-rail-label", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.4);
          const items = gsap.utils.toArray(".kp-item");
          // Explicit reveal cues (local seconds) sync each bullet to the moment
          // the narration says it. Empty/absent → default even spread.
          const cues = String(vars.pointCues || "")
            .split(",")
            .map(function (s) { return Number(s.trim()); })
            .filter(function (v) { return !isNaN(v); });
          items.forEach(function (item, i) {
            const at = cues.length ? Math.max(0.4, cues[i]) : 0.85 + i * 0.55;
            tl.fromTo(
              item,
              { opacity: 0, x: 70 },
              { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" },
              at,
            );
            const num = item.querySelector(".kp-num");
            tl.fromTo(num, { scale: 0.4 }, { scale: 1, duration: 0.5, ease: "back.out(1.6)" }, at + 0.05);
            // Compound cue (Motion v2, 2026-07-27): the arriving row dims the
            // already-settled siblings to 0.6; the closing beat restores them.
            if (i > 0) tl.to(items.slice(0, i), { opacity: 0.6, duration: 0.3, ease: "power2.out" }, at);
          });
          // Furniture paints at t=0 (design-contract.md — no bare first frame at a cut):
          // opacity 0.55 → 1 in ~0.3s so cuts land as a hit, not a dissolve.
          tl.fromTo("#kp-index", { opacity: 0.55 }, { opacity: 1, duration: 0.3 }, 0);
          tl.fromTo(["#kp-ghost-ring", "#kp-ghost-ring-2"], { opacity: 0.55 }, { opacity: 1, duration: 0.3 }, 0);
          tl.fromTo("#kp-ghost-ring", { rotation: 0 }, { rotation: 4, duration: 5.4, ease: "sine.inOut", repeat: 0 }, 1.4);
          tl.fromTo("#kp-ghost-ring-2", { scale: 1 }, { scale: 1.05, duration: 2.9, ease: "sine.inOut", repeat: 1, yoyo: true }, 1.6);
          // Ambient drift cycles (2026-07-15 animacy regression fix): the ghost rings
          // drift in finite translate-only sine yoyo cycles across the whole scene so
          // the decorative layer registers at QA frame sampling even between cues.
          const drift = function (sel, ax, ay, per) {
            tl.fromTo(sel, { x: 0, y: 0 }, { x: ax, y: ay, duration: per, ease: "sine.inOut",
              yoyo: true, repeat: Math.max(1, Math.ceil(sceneDur / per) - 1) }, 0);
          };
          drift("#kp-ghost-ring", 24, 14, 3.3);
          drift("#kp-ghost-ring-2", -20, -12, 2.8);
          // Idle re-animation of settled content remains banned (owner decisions
          // 2026-07-14/15), but the cued closing beat and the scene exit below are
          // REQUIRED (Motion v2, 2026-07-27) — additive NEW beats, never in-place
          // re-marks of settled rows/headings.
          // Sub-beats: a cued live line that swaps text on each spoken cue —
          // covers narration spans between primary reveals (dead-hold fix,
          // owner-approved 2026-07-14). Empty subBeats (the default) = no DOM,
          // no timeline impact. Seek-safe: tween-only swaps, no .call().
          // Appended to #kp-subbeat-host (NOT getElementById("root") — duplicate
          // root ids resolve to the first scene in the composited render; see the
          // scla-chips subBeat root-cause fix, 2026-07-27).
          const subBeats = String(vars.subBeats || "").split("|").map(function (s) { return s.trim(); }).filter(Boolean);
          const subCues = String(vars.subCues || "").split(",").map(function (s) { return Number(s.trim()); }).filter(function (v) { return !isNaN(v); });
          const subEls = [];
          if (subBeats.length && subCues.length === subBeats.length) {
            subBeats.forEach(function (text, i) {
              const el = document.createElement("div");
              el.className = "kp-subbeat";
              el.setAttribute("data-layout-allow-occlusion", "");
              el.textContent = text;
              document.getElementById("kp-subbeat-host").appendChild(el);
              subEls.push(el);
              const at = Math.max(0.4, subCues[i]);
              tl.fromTo(el, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at);
              if (i + 1 < subBeats.length) {
                const out = Math.max(at + 0.5, Math.max(0.4, subCues[i + 1]) - 0.35);
                tl.to(el, { opacity: 0, y: -18, duration: 0.3, ease: "power2.in" }, out);
              }
            });
          }
          // Closing beat (Motion v2, 2026-07-27) — one additive resolve in the final
          // second: dimmed rows restore to full and a gold rule completes under the
          // heading. NEW state only, never re-animation of settled text in place.
          const closeAt = sceneDur - 1.0;
          tl.to(items, { opacity: 1, duration: 0.4, ease: "power2.out" }, closeAt);
          tl.fromTo("#kp-close-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, closeAt);
          // Exit (Motion v2, 2026-07-27) — the content layer leaves at −0.35s so the
          // seam reads velocity-matched; furniture and ghost rings never exit.
          const exitAt = sceneDur - 0.35;
          tl.to("#kp-head", { opacity: 0, y: -24, duration: 0.3, ease: "power2.in" }, exitAt);
          tl.to(items, { opacity: 0, x: -40, duration: 0.3, ease: "power2.in" }, exitAt);
          if (subEls.length) tl.to(subEls, { opacity: 0, y: -24, duration: 0.3, ease: "power2.in" }, exitAt);
          // Hard-kill at the boundary (gsap_exit_missing_hard_kill lint).
          tl.set(["#kp-head"].concat(items, subEls), { opacity: 0 }, sceneDur - 0.02);
          window.__timelines["scla-points"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
