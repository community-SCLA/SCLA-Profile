    <style>
      /* ---- Brand face: Proxima Nova, self-hosted (tokens.yml typography:) ----
         Declared once in the HOST head. Sub-compositions are cloned INTO this
         document, so the face resolves for them too. */
      @font-face {
        font-family: "Proxima Nova";
        src: url("assets/fonts/proxima-nova-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Proxima Nova";
        src: url("assets/fonts/proxima-nova-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Proxima Nova";
        src: url("assets/fonts/proxima-nova-900.woff2") format("woff2");
        font-weight: 900;
        font-style: normal;
        font-display: block;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;
      }
      body {
        font-family: "Proxima Nova", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      /* Full-bleed fill lives on a CHILD, never on the composition root — the
         producer can drop a root background and render the frame black. */
      #bg {
        position: absolute;
        inset: 0;
        background: #ffffff;
      }
      /* The lift is the only ambient layer in the piece. */
      #bg-lift {
        position: absolute;
        left: 50%;
        top: 48%;
        width: 1760px;
        height: 1240px;
        margin: -620px 0 0 -880px;
        background: radial-gradient(
          ellipse at center,
          rgba(246, 246, 249, 1) 0%,
          rgba(229, 239, 246, 0.72) 44%,
          rgba(255, 255, 255, 0) 74%
        );
        will-change: transform;
      }
      #bg-grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(204, 206, 223, 0.34) 1px, transparent 1px),
          linear-gradient(90deg, rgba(204, 206, 223, 0.34) 1px, transparent 1px);
        background-size: 120px 120px;
        background-position: 0 0;
      }

      /* Persistent chrome — the program banner, present for the whole runtime.
         Sits inside the declared chrome region (tokens.yml chrome-regions). */
      #chrome {
        position: absolute;
        left: 120px;
        top: 62px;
        display: flex;
        align-items: center;
        gap: 20px;
        opacity: 0;
      }
      #chrome-mark {
        display: block;
        width: 10px;
        height: 32px;
        background: #eaab2d;
      }
      #chrome-text {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #5f6f96;
      }

      /* Sub-composition slots fill the frame. */
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Chrome settles once, then never moves again.
      tl.fromTo("#chrome", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 0.3);

      // The one ambient layer of the piece. The declaration lives INSIDE the
      // tween, which is where check_motion reads it.
      tl.fromTo(
        "#bg-lift",
        { scale: 1, opacity: 0.94 },
        {
          scale: 1.05,
          opacity: 1,
          duration: 8,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 19,
          /* motion-allow: background lift only, never content — the single ambient layer, finite repeats (8s x 20 legs = 160s covers the 157.545s runtime) */
        },
        0,
      );

      window.__timelines["main"] = tl;
    </script>
