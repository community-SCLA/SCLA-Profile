      <h2 class="wl-hd" id="hd-s04">An Understandable Question</h2>
      <h2 class="wl-hd" id="hd-s05">Not the Most Useful Question</h2>
      <h2 class="wl-hd" id="hd-s06">Not Deleted — Reshaped</h2>
      <h2 class="wl-hd" id="hd-s07">The Tasks Shift, the Tools Change</h2>
      <h2 class="wl-hd" id="hd-s09">Where Does That Create an Opening?</h2>
      <h2 class="wl-hd" id="hd-s11">First, What Gets Faster or Cheaper</h2>
      <h2 class="wl-hd" id="hd-s12">Then, What Becomes More Valuable</h2>
      <h2 class="wl-hd" id="hd-s15">A Simple Example</h2>
      <h2 class="wl-hd" id="hd-s16">AI Drafts the First Pass</h2>
      <h2 class="wl-hd" id="hd-s17">Drafting Becomes Less Scarce</h2>
      <h2 class="wl-hd" id="hd-s18">Aim Yourself at That Part</h2>
      <h2 class="wl-hd" id="hd-s19">Do Not Panic — Adapt</h2>
      <h2 class="wl-hd" id="hd-s20">Where AI Is Strong</h2>
      <h2 class="wl-hd" id="hd-s21">What Still Depends on People</h2>
      <h2 class="wl-hd" id="hd-s24">Learn to Work with These Tools</h2>
      <h2 class="wl-hd" id="hd-s25">A Simple Loop</h2>
      <h2 class="wl-hd" id="hd-s26">You Cannot Control the Change</h2>
      <h2 class="wl-hd" id="hd-s27">Look for the Openings</h2>
      <div class="wl-body" id="bd-s02">It can feel both at once.</div>
      <div class="wl-body" id="bd-s05">For planning your career, it is not the most useful one.</div>
      <div class="wl-body" id="bd-s06">Most roles are not deleted by new technology.</div>
      <div class="wl-body" id="bd-s07">The people who thrive adapt what they focus on.</div>
      <div class="wl-body" id="bd-s09">How will AI change the work you want to do?</div>
      <div class="wl-body" id="bd-s11">Assume those tasks get automated or accelerated.</div>
      <div class="wl-body" id="bd-s12">Usually the judgment, the relationships, the creativity, and the oversight.</div>
      <div class="wl-body" id="bd-s16">AI can draft a first pass of almost any document.</div>
      <div class="wl-body" id="bd-s17">The person who knows what is worth saying becomes more valuable.</div>
      <div class="wl-body" id="bd-s19">You do not need to panic, but you do need to adapt.</div>
      <div class="wl-body" id="bd-s20">Speed, repetition, summarizing, and first drafts.</div>
      <div class="wl-body" id="bd-s21">Judgment, trust, communication, collaboration, and ethical choices.</div>
      <div class="wl-body" id="bd-s24">Strengthen the human abilities tools do not replace easily.</div>
      <div class="wl-body" id="bd-s25">A human question, an AI draft, a human review, and a better result.</div>
      <div class="wl-body" id="bd-s26">You cannot control how AI changes work.</div>
      <div class="wl-body" id="bd-s27">Build judgment, range, and tool fluency.</div>
