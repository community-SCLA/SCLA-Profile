<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Proxima Nova";
        src: url("assets/fonts/proxima-nova-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Proxima Nova";
        src: url("assets/fonts/proxima-nova-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Proxima Nova";
        src: url("assets/fonts/proxima-nova-900.woff2") format("woff2");
        font-weight: 900;
        font-style: normal;
        font-display: block;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0d2437;
      }
      body {
        font-family: "Proxima Nova", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      /* Full-bleed fill lives on a CHILD, never on the composition root. */
      #bg {
        position: absolute;
        inset: 0;
        background: #0d2437;
      }
      #bg-glow {
        position: absolute;
        left: 1010px;
        top: 640px;
        width: 1900px;
        height: 1180px;
        margin: -590px 0 0 -950px;
        background: radial-gradient(
          ellipse at center,
          rgba(51, 147, 214, 0.13) 0%,
          rgba(13, 36, 55, 0.4) 46%,
          rgba(13, 36, 55, 0) 76%
        );
        will-change: transform;
      }
      #bg-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at 50% 50%,
          rgba(10, 30, 47, 0) 58%,
          rgba(10, 30, 47, 0.66) 100%
        );
      }

      /* Persistent program banner, inside the declared chrome region. */
      #chrome {
        position: absolute;
        z-index: 4;
        left: 120px;
        top: 62px;
        display: flex;
        align-items: center;
        gap: 20px;
        opacity: 0;
      }
      #chrome-mark {
        display: block;
        width: 10px;
        height: 30px;
        background: #eaab2d;
      }
      #chrome-text {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.66);
      }

      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="159.161" data-width="1920" data-height="1080">
      <div id="bg">
        <div id="bg-glow"></div>
        <div id="bg-vignette"></div>
      </div>

      <div id="chrome">
        <span id="chrome-mark"></span>
        <span id="chrome-text">Early Career Boost</span>
      </div>

      <!-- ONE carrying object for the whole runtime: the wall of task-bricks.
           s01 -> s28, laid once, re-laid, never emptied. See design.md. -->
      <div id="el-wall" data-composition-id="wall" data-composition-src="compositions/wall.html" data-start="0" data-duration="159.161" data-track-index="1" data-width="1920" data-height="1080"></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // The banner settles once, then never moves again.
      tl.fromTo("#chrome", { opacity: 0, x: -22 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 0.3);

      // One shared ambient breath, on the background GLOW only — never on
      // content. Finite legs sized to the runtime.
      tl.fromTo(
        "#bg-glow",
        { scale: 1 },
        { scale: 1.03, duration: 7, ease: "sine.inOut", yoyo: true, repeat: 22 }, /* motion-allow: background depth-drift on a non-content layer; the design contract sanctions ambient breath on the background glow only */
        0,
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
