>
  <head>

  <body>
    <template>
      <style>

      <style>
        #root {

        #kp__i6-rail {

        .kp__i6-num {
          flex: none;

        /* Optional per-item living icon (opt-in via `icons`; Motion v2 2026-07-27) —

        .kp__i6-icon { flex: none; width: 64px; height: 64px; margin-left: auto; }
        .kp__i6-icon svg { width: 64px; height: 64px; }
        /* Closing-beat rule (Motion v2, 2026-07-27) — completes under the heading in

        #kp__i6-close-rule { margin-top: 18px; width: 240px; height: 4px; background: #eaab2d; transform: scaleX(0); transform-origin: left center; }
        #kp__i6-index {

        /* Sub-beats — narration-synced live line (dead-hold fix, 2026-07-14).
           One beat visible at a time; absent unless subBeats is set. */
        .kp__i6-subbeat {
          position: absolute;
          left: 160px;
          right: 160px;
          bottom: 132px;
          text-align: center;
          font-size: 40px;
          font-weight: 700;
          color: #0d2437;
          opacity: 0;
        }
        /* Style packages (design-contract.md "Style packages") — visual layer only; timeline identical */
        #root[data-theme="horizon"] .kp__i6-bg { background: #ffffff; background-image: radial-gradient(rgba(51, 147, 214, 0.12) 2px, transparent 2px); background-size: 72px 72px; }
        #root[data-theme="horizon"] #kp__i6-ghost-ring { left: auto; bottom: auto; right: -320px; top: -420px; border-color: rgba(51, 147, 214, 0.14); }
        #root[data-theme="horizon"] #kp__i6-ghost-ring-2 { left: auto; bottom: auto; right: -200px; top: -320px; border-color: rgba(234, 171, 45, 0.16); }
        #root[data-theme="horizon"] #kp__i6-tick { background: #3393d6; }
        #root[data-theme="horizon"] #kp__i6-close-rule { background: #3393d6; }

        #root[data-theme="cadence"] .kp__i6-bg { background: #ffffff; background-image: linear-gradient(rgba(51, 147, 214, 0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(51, 147, 214, 0.09) 1px, transparent 1px); background-size: 96px 96px; }
        #root[data-theme="cadence"] #kp__i6-tick { width: 70px; }
        #root[data-theme="cadence"] #kp__i6-close-rule { width: 300px; }
        #root[data-theme="cadence"] .kp__i6-num { background: #0d2437; color: #eaab2d; }
        #root[data-theme="cadence"] #kp__i6-rail { background: #eaab2d; }
        #root[data-theme="cadence"] .kp__i6-item { border-bottom-color: #e5eff6; }
      </style>

      <div id="root" data-composition-id="scla-points__i6" data-width="1920" data-height="1080" data-duration="8">
        <div class="kp__i6-bg"></div>
        <div id="kp__i6-ghost-ring" data-layout-allow-overflow></div>
        <div id="kp__i6-ghost-ring-2" data-layout-allow-overflow></div>
        <div id="kp__i6-rail"></div>
        <div id="kp__i6-rail-label">SCLA · Lesson System</div>
        <div id="kp__i6-head">
          <div id="kp__i6-label-row">
            <div id="kp__i6-tick"></div>
            <div id="kp__i6-label">Why decisions feel hard</div>
          </div>
          <h2 id="kp__i6-heading">Four pressure traps</h2>
          <div id="kp__i6-close-rule"></div>
        </div>
        <div id="kp__i6-list">
          <div class="kp__i6-item" id="kp__i6-item-1">
            <div class="kp__i6-num">1</div>
            <div class="kp__i6-text" id="kp__i6-text-1">Deciding under pressure</div>
          </div>
          <div class="kp__i6-item" id="kp__i6-item-2">
            <div class="kp__i6-num">2</div>
            <div class="kp__i6-text" id="kp__i6-text-2">Comparing yourself to others</div>
          </div>
          <div class="kp__i6-item" id="kp__i6-item-3">
            <div class="kp__i6-num">3</div>
            <div class="kp__i6-text" id="kp__i6-text-3">Fixating on one factor, like salary or prestige</div>
          </div>
          <div class="kp__i6-item" id="kp__i6-item-4">
            <div class="kp__i6-num">4</div>
            <div class="kp__i6-text" id="kp__i6-text-4">Staying the course only because of sunk costs</div>
          </div>
        </div>
        <!-- Static append target for cued sub-beats. Appending to #root by id is unsafe:
             every scene's template root is id="root", so in the composited render
             getElementById("root") resolves to the FIRST scene's root (see the
             scla-chips subBeat root-cause note, fixed 2026-07-27). -->
        <div id="kp__i6-subbeat-host">
          <!-- Geometry declaration for the sub-beat lines the script creates at
               run time: empty and opacity:0, so it paints nothing. It exists so
               check_geometry.py can see the box those lines occupy. A box only
               the browser knows about is a box no gate can grade — which is how
               scla-loop's sub-beat landed on a caption on 2026-07-29. -->
          <div class="kp__i6-subbeat" id="kp__i6-subbeat-proto" data-slot="subBeats" data-geometry-proto></div>
        </div>
        <div id="kp__i6-index">02 / KEY POINTS</div>
      </div>

      <script>
        (function () {
          const defaults = {
            label: "Why decisions feel hard",
            heading: "Four pressure traps",
            point1: "Deciding under pressure",
            point2: "Comparing yourself to others",
            point3: "Fixating on one factor, like salary or prestige",
            point4: "Staying the course only because of sunk costs",
            sceneIndex: "02 / KEY POINTS",
            theme: "summit",
            pointCues: "",
            icons: "",
            sceneDuration: "10",
          };
          const vars = Object.assign(
            {},
            defaults,
            window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {},
          );
          document.getElementById("root").setAttribute("data-theme", vars.theme || "summit");
          document.getElementById("kp__i6-label").textContent = vars.label;
          document.getElementById("kp__i6-heading").textContent = vars.heading;
          document.getElementById("kp__i6-index").textContent = vars.sceneIndex;
          const points = [vars.point1, vars.point2, vars.point3, vars.point4];
          points.forEach(function (p, i) {
            const item = document.getElementById("kp__i6-item-" + (i + 1));
            if (p && String(p).trim() !== "") {
              document.getElementById("kp__i6-text-" + (i + 1)).textContent = p;
            } else {
              item.remove();
            }
          });

          // Optional per-item living icons (opt-in via `icons`, positional per visible
          // row). Geometry MIRRORED from scla-condition.html's ICONS map (the canonical
          // source; design-contract.md → "Living icon library" — keep in sync, never diverge).
          // Light canvas → navy main stroke, gold accents/dots pop last.
          const RING = "M 48 16 A 32 32 0 1 1 48 80 A 32 32 0 1 1 48 16 Z";
          const ICONS = {
            compass: { paths: [{ d: RING }, { d: "M37 59 L54 42", gd: true }, { d: "M59 37 L52 44 L55 47 Z", gd: true }], circles: [{ cx: 48, cy: 48, r: 3.5, fill: true }] },
            pressure: { paths: [{ d: RING }, { d: "M48 48 L48 28" }, { d: "M48 48 L63 55", gd: true }], circles: [{ cx: 48, cy: 48, r: 3.5, fill: true }] },
            insight: { paths: [{ d: "M 48 22 A 18 18 0 1 1 48 58 A 18 18 0 1 1 48 22 Z" }, { d: "M40 55 L56 55" }, { d: "M43 61 L53 61" }, { d: "M42 43 L48 36 L54 43", gd: true }], circles: [] },
            salary: { paths: [{ d: "M26 46 L46 26 L70 26 L70 50 L50 70 Z" }], circles: [{ cx: 58, cy: 38, r: 5, gd: true }] },
            map: { paths: [{ d: "M18 30 L38 22 L58 30 L78 22 L78 66 L58 74 L38 66 L18 74 Z" }, { d: "M38 22 L38 66" }, { d: "M58 30 L58 74" }, { d: "M48 41 L48 52", gd: true }], circles: [{ cx: 48, cy: 36, r: 5, gd: true }] },
            mentorship: { paths: [{ d: "M20 70 Q36 52 52 70" }, { d: "M50 72 Q64 56 78 72", gd: true }], circles: [{ cx: 36, cy: 34, r: 10 }, { cx: 64, cy: 40, r: 9, gd: true }] },
            mentorship2: { paths: [{ d: "M20 70 Q36 52 52 70", gd: true }, { d: "M50 72 Q64 56 78 72" }], circles: [{ cx: 36, cy: 34, r: 9, gd: true }, { cx: 64, cy: 40, r: 10 }] },
            growth: { paths: [{ d: "M22 74 L22 22" }, { d: "M22 74 L76 74" }, { d: "M28 62 L42 50 L54 56 L72 32" }, { d: "M62 32 L72 32 L72 42", gd: true }], circles: [] },
            target: { paths: [{ d: RING }, { d: "M 48 28 A 20 20 0 1 1 48 68 A 20 20 0 1 1 48 28 Z" }], circles: [{ cx: 48, cy: 48, r: 8, gd: true, fill: true }] },
            question: { paths: [{ d: RING }, { d: "M39 40 Q39 30 48 30 Q58 30 58 40 Q58 48 48 51 L48 56", gd: true }], circles: [{ cx: 48, cy: 65, r: 3.2, gd: true, fill: true }] },
            examine: { paths: [{ d: "M 48 12 A 22 22 0 1 1 48 56 A 22 22 0 1 1 48 12 Z" }, { d: "M58 58 L76 76", gd: true }], circles: [] },
            done: { paths: [{ d: RING }, { d: "M34 49 L44 60 L64 37", gd: true }], circles: [] },
          };

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });
          const sceneDur = Math.max(4, Number(vars.sceneDuration) || 10);
          // Entrance settles ≤1.2s (Motion v2, 2026-07-27): hero tweens ≤0.6s,
          // relative order/stagger feel preserved from the v1 choreography.
          tl.fromTo("#kp__i6-tick", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.1);
          tl.fromTo("#kp__i6-label", { opacity: 0, x: -32 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.15);
          tl.fromTo("#kp__i6-heading", { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.6, ease: "power4.out" }, 0.3);
          tl.fromTo("#kp__i6-rail", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power2.out" }, 0.15);
          tl.fromTo("#kp__i6-rail-label", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.4);
          const items = gsap.utils.toArray(".kp__i6-item");
          // Explicit reveal cues (local seconds) sync each bullet to the moment
          // the narration says it. Empty/absent → default even spread.
          const cues = String(vars.pointCues || "")
            .split(",")
            .map(function (s) { return Number(s.trim()); })
            .filter(function (v) { return !isNaN(v); });
          // Build the optional per-item icons (positional; empty slot = no icon).
          const iconNames = String(vars.icons || "").split(",").map(function (s) { return s.trim(); });
          const iconSets = items.map(function (item, i) {
            const ic = iconNames[i] ? ICONS[iconNames[i]] : null;
            if (!ic) return null;
            const wrap = document.createElement("div");
            wrap.className = "kp__i6-icon";
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", "0 0 96 96");
            svg.setAttribute("fill", "none");
            wrap.appendChild(svg);
            item.appendChild(wrap);
            // Hidden until this item's icon draw-on fires (render-qa friction
            // log, 2026-07-27 B1): round stroke-linecaps paint a filled dot even
            // at strokeDashoffset 100/zero visible length, so without this the
            // dot is visible — cascading through the row's own fade-in — before
            // the draw-on fires.
            wrap.style.opacity = "0";
            const draws = [], dots = [];
            const strokeMain = "#0d2437";
            (ic.paths || []).forEach(function (p) {
              const el = document.createElementNS("http://www.w3.org/2000/svg", "path");
              el.setAttribute("d", p.d); el.setAttribute("fill", "none");
              el.setAttribute("stroke", p.gd ? "#eaab2d" : strokeMain);
              el.setAttribute("stroke-width", "4"); el.setAttribute("stroke-linecap", "round"); el.setAttribute("stroke-linejoin", "round");
              el.setAttribute("pathLength", "100"); svg.appendChild(el); draws.push(el);
            });
            (ic.circles || []).forEach(function (c) {
              const el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
              el.setAttribute("cx", c.cx); el.setAttribute("cy", c.cy); el.setAttribute("r", c.r);
              if (c.fill) { el.setAttribute("fill", c.gd ? "#eaab2d" : strokeMain); el.setAttribute("stroke", "none"); dots.push(el); }
              else { el.setAttribute("fill", "none"); el.setAttribute("stroke", c.gd ? "#eaab2d" : strokeMain); el.setAttribute("stroke-width", "4"); el.setAttribute("pathLength", "100"); draws.push(el); }
              svg.appendChild(el);
            });
            return { wrap: wrap, draws: draws, dots: dots };
          });
          items.forEach(function (item, i) {
            const at = cues.length ? Math.max(0.4, cues[i]) : 0.85 + i * 0.55;
            tl.fromTo(
              item,
              { opacity: 0, x: 70 },
              { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" },
              at,
            );
            const num = item.querySelector(".kp__i6-num");
            tl.fromTo(num, { scale: 0.4 }, { scale: 1, duration: 0.5, ease: "back.out(1.6)" }, at + 0.05);
            // Compound cue (Motion v2, 2026-07-27): the arriving row dims the
            // already-settled siblings to 0.6; the closing beat restores them.
            if (i > 0) tl.to(items.slice(0, i), { opacity: 0.6, duration: 0.3, ease: "power2.out" }, at);
            // Icon draws on with the row's cue; gold accents/dots pop last.
            const set = iconSets[i];
            if (set) {
              tl.set(set.wrap, { opacity: 1 }, at + 0.1);
              if (set.draws.length) tl.fromTo(set.draws, { strokeDasharray: "100 100", strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.45, ease: "power3.out", stagger: 0.1 }, at + 0.1);
              if (set.dots.length) tl.fromTo(set.dots, { scale: 0, transformOrigin: "center" }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, at + 0.5);
            }
          });
          // Furniture paints at t=0 (design-contract.md — no bare first frame at a cut):
          // opacity 0.55 → 1 in ~0.3s so cuts land as a hit, not a dissolve.
          tl.fromTo("#kp__i6-index", { opacity: 0.55 }, { opacity: 1, duration: 0.3 }, 0);
          tl.fromTo(["#kp__i6-ghost-ring", "#kp__i6-ghost-ring-2"], { opacity: 0.55 }, { opacity: 1, duration: 0.3 }, 0);
          tl.fromTo("#kp__i6-ghost-ring", { rotation: 0 }, { rotation: 4, duration: 5.4, ease: "sine.inOut", repeat: 0 }, 1.4);
          tl.fromTo("#kp__i6-ghost-ring-2", { scale: 1 }, { scale: 1.05, duration: 2.9, ease: "sine.inOut", repeat: 1, yoyo: true }, 1.6);
          // Ambient drift cycles (2026-07-15 animacy regression fix): the ghost rings
          // drift in finite translate-only sine yoyo cycles across the whole scene so
          // the decorative layer registers at QA frame sampling even between cues.
          const drift = function (sel, ax, ay, per) {
            tl.fromTo(sel, { x: 0, y: 0 }, { x: ax, y: ay, duration: per, ease: "sine.inOut",
              yoyo: true, repeat: Math.max(1, Math.ceil(sceneDur / per) - 1) }, 0);
          };
          drift("#kp__i6-ghost-ring", 24, 14, 3.3);
          drift("#kp__i6-ghost-ring-2", -20, -12, 2.8);
          // Idle re-animation of settled content remains banned (owner decisions
          // 2026-07-14/15), but the cued closing beat and the scene exit below are
          // REQUIRED (Motion v2, 2026-07-27) — additive NEW beats, never in-place
          // re-marks of settled rows/headings.
          // Sub-beats: a cued live line that swaps text on each spoken cue —
          // covers narration spans between primary reveals (dead-hold fix,
          // owner-approved 2026-07-14). Empty subBeats (the default) = no DOM,
          // no timeline impact. Seek-safe: tween-only swaps, no .call().
          // Appended to #kp__i6-subbeat-host (NOT getElementById("root") — duplicate
          // root ids resolve to the first scene in the composited render; see the
          // scla-chips subBeat root-cause fix, 2026-07-27).
          const subBeats = String(vars.subBeats || "").split("|").map(function (s) { return s.trim(); }).filter(Boolean);
          const subCues = String(vars.subCues || "").split(",").map(function (s) { return Number(s.trim()); }).filter(function (v) { return !isNaN(v); });
          const subEls = [];
          if (subBeats.length && subCues.length === subBeats.length) {
            subBeats.forEach(function (text, i) {
              const el = document.createElement("div");
              el.className = "kp__i6-subbeat";
              el.setAttribute("data-layout-allow-occlusion", "");
              el.textContent = text;
              document.getElementById("kp__i6-subbeat-host").appendChild(el);
              subEls.push(el);
              const at = Math.max(0.4, subCues[i]);
              tl.fromTo(el, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at);
              if (i + 1 < subBeats.length) {
                const out = Math.max(at + 0.5, Math.max(0.4, subCues[i + 1]) - 0.35);
                tl.to(el, { opacity: 0, y: -18, duration: 0.3, ease: "power2.in" }, out);
              }
            });
          }
          // Closing beat (Motion v2, 2026-07-27) — one additive resolve in the final
          // second: dimmed rows restore to full and a gold rule completes under the
          // heading. NEW state only, never re-animation of settled text in place.
          const closeAt = sceneDur - 1.0;
          tl.to(items, { opacity: 1, duration: 0.4, ease: "power2.out" }, closeAt);
          tl.fromTo("#kp__i6-close-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, closeAt);
          // Exit (Motion v2, 2026-07-27) — the content layer leaves at −0.35s so the
          // seam reads velocity-matched; furniture and ghost rings never exit.
          const exitAt = sceneDur - 0.35;
