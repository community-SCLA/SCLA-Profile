          drift("#cc__i3-ghost-ring-2", -90, -55, 2.8);
          // Idle re-animation of settled content remains banned (owner decisions
          // 2026-07-14/15), but the cued closing beat and the scene exit below are
          // REQUIRED (Motion v2, 2026-07-27) — additive NEW beats, never in-place
          // re-marks of settled chips/headings.
          // Sub-beats: a cued live line that swaps text on each spoken cue —
          // covers narration spans between primary reveals (dead-hold fix,
          // owner-approved 2026-07-14). Empty subBeats (the default) = no DOM,
          // no timeline impact. Seek-safe: tween-only swaps, no .call().
          // BUG FIXED 2026-07-27 (was KNOWN BUG 2026-07-15, "subBeat never renders"):
          // root cause was the append target, document.getElementById("root").
          // Every scene's template root carries id="root", and element ids are NOT
          // rewritten when sub-comps are inlined into the composited render — so
          // getElementById("root") resolves to the FIRST scene's root in document
          // order, and the sub-beat landed in another scene's slot: outside this
          // scene's CSS scope ([data-composition-id="scla-chips__i3"] .cc__i3-subbeat no
          // longer matches → unstyled) and hidden whenever this scene is on screen.
          // Chips rendered fine because #cc__i3-field is unique document-wide; Studio
          // preview mounts each scene in its own iframe (single #root), which is why
          // the bug never reproduced outside composited renders. Fix: append to the
          // static #cc__i3-subbeat-host wrapper declared in this template's markup.
          const subBeats = String(vars.subBeats || "").split("|").map(function (s) { return s.trim(); }).filter(Boolean);
          const subCues = String(vars.subCues || "").split(",").map(function (s) { return Number(s.trim()); }).filter(function (v) { return !isNaN(v); });
          const subEls = [];
          if (subBeats.length && subCues.length === subBeats.length) {
            subBeats.forEach(function (text, i) {
              const el = document.createElement("div");
              el.className = "cc__i3-subbeat";
              el.setAttribute("data-layout-allow-occlusion", "");
              el.textContent = text;
              document.getElementById("cc__i3-subbeat-host").appendChild(el);
              subEls.push(el);
              const at = Math.max(0.4, subCues[i]);
              tl.fromTo(el, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at);
              if (i + 1 < subBeats.length) {
                const out = Math.max(at + 0.5, Math.max(0.4, subCues[i + 1]) - 0.35);
                tl.to(el, { opacity: 0, y: -18, duration: 0.3, ease: "power2.in" }, out);
              }
            });
          }
          // Closing beat (Motion v2, 2026-07-27) — one additive resolve in the final
          // second: dimmed chips restore to full and a gold rule completes under the
          // heading. NEW state only, never re-animation of settled text in place.
          const closeAt = sceneDur - 1.0;
          tl.to(chips, { opacity: 1, duration: 0.4, ease: "power2.out" }, closeAt);
          tl.fromTo("#cc__i3-close-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, closeAt);
          // Exit (Motion v2, 2026-07-27) — the content layer leaves at −0.35s so the
          // seam reads velocity-matched; furniture and ghost rings never exit.
          const exitAt = sceneDur - 0.35;
          tl.to(["#cc__i3-head"].concat(chips, subEls), { opacity: 0, y: -24, duration: 0.3, ease: "power2.in" }, exitAt);
          if (ic) tl.to("#cc__i3-iconwrap", { opacity: 0, x: 40, duration: 0.3, ease: "power2.in" }, exitAt);
          // Hard-kill at the boundary (gsap_exit_missing_hard_kill lint).
          const killTargets = ["#cc__i3-head"].concat(chips, subEls, ic ? ["#cc__i3-iconwrap"] : []);
          tl.set(killTargets, { opacity: 0 }, sceneDur - 0.02);
          window.__timelines["scla-chips__i3"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
