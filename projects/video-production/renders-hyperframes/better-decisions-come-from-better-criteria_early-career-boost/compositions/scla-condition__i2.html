  <head>
    <meta charset="UTF-8">
    <!--
      CONDITION / PRINCIPLE CARD — one item of an enumerated set (condition N of M,
      principle N of M, pillar N of M) that the narration introduces one at a time.
      Left-aligned text column (number badge, eyebrow, heading, detail chips on their
      spoken cue) with a brand-native LIVING ICON as the hero illustration on the right.
      Progress dots show which of the set this is. Living icons are reserved for this

  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "proxima-nova"; src: url("assets/fonts/proxima-nova-400.woff2") format("woff2"); font-weight: 400; font-style: normal; }
        @font-face { font-family: "proxima-nova"; src: url("assets/fonts/proxima-nova-700.woff2") format("woff2"); font-weight: 700; font-style: normal; }

      </style>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "proxima-nova", system-ui, sans-serif;
        }
        .cd__i2-bg {
          position: absolute;
          inset: 0;
          background: #ffffff;
          background-image:
            linear-gradient(rgba(51, 147, 214, 0.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(51, 147, 214, 0.06) 1px, transparent 1px);
          background-size: 120px 120px;
        }
        #cd__i2-ghost {
          position: absolute;

        #cd__i2-corner-tl { left: 60px; top: 60px; border-right: none; border-bottom: none; }
        #cd__i2-corner-br { right: 60px; bottom: 60px; border-left: none; border-top: none; }
        #cd__i2-progress { position: absolute; left: 160px; top: 180px; display: flex; gap: 16px; }

        .pdot.on { background: #eaab2d; border-color: #eaab2d; }
        /* Text is a clean left-aligned column; the living icon is the hero on the RIGHT. */
        #cd__i2-num {
          position: absolute; left: 160px; top: 292px; width: 84px; height: 84px; border-radius: 50%;

        #cd__i2-heading { position: absolute; left: 160px; top: 408px; width: 1060px; font-size: 84px; font-weight: 900; color: #0d2437; line-height: 1.06; }

        #cd__i2-iconwrap { position: absolute; left: 1370px; top: 378px; width: 300px; height: 300px; }
        #cd__i2-iconwrap svg { width: 300px; height: 300px; }
        #cd__i2-index { position: absolute; right: 120px; bottom: 58px; font-size: 20px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #5f6f96; }

        /* Style packages (design-contract.md "Style packages") — visual layer only; timeline identical */
        #root[data-theme="horizon"] .cd__i2-bg { background-image: radial-gradient(rgba(51, 147, 214, 0.1) 2px, transparent 2px); background-size: 72px 72px; }
        #root[data-theme="horizon"] #cd__i2-num { background: transparent; border: 3px solid #0d2437; color: #0d2437; box-sizing: border-box; }
        #root[data-theme="horizon"] #cd__i2-rule { background: #3393d6; }

        #root[data-theme="cadence"] .cd__i2-bg::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #eaab2d; }
        #root[data-theme="cadence"] #cd__i2-num { background: #eaab2d; color: #0d2437; }
        #root[data-theme="cadence"] #cd__i2-rule { width: 170px; }
        #root[data-theme="cadence"] .chip { border-color: #0d2437; }
      </style>

      <div data-hf-id="hf-z0vd" id="root" data-composition-id="scla-condition__i2" data-width="1920" data-height="1080" data-duration="8" data-layout-allow-overflow="">
        <div data-hf-id="hf-93i3" class="cd__i2-bg"></div>
        <div data-hf-id="hf-9r73" id="cd__i2-ghost" data-layout-allow-overflow=""></div>
        <div data-hf-id="hf-ay25" class="cd__i2-corner" id="cd__i2-corner-tl"></div>
        <div data-hf-id="hf-pmnp" class="cd__i2-corner" id="cd__i2-corner-br"></div>
        <div data-hf-id="hf-glg0" id="cd__i2-progress"></div>
        <div data-hf-id="hf-hko2" id="cd__i2-num">1</div>
        <div data-hf-id="hf-xs7y" id="cd__i2-iconwrap"><svg data-hf-id="hf-2787" viewBox="0 0 96 96" fill="none" /></div>
        <div data-hf-id="hf-pmlb" id="cd__i2-kicker">Condition one</div>
        <div data-hf-id="hf-vuv7" id="cd__i2-rule"></div>
        <div data-hf-id="hf-3d56" id="cd__i2-heading">Engaging work</div>
        <div data-hf-id="hf-nr3a" id="cd__i2-chips"></div>
        <div data-hf-id="hf-lyg1" id="cd__i2-index" data-layout-allow-occlusion="">09 / ENGAGING</div>
        <div data-hf-id="hf-pffb" id="cd__i2-brandline">SCLA · Lesson System</div>
      </div>

      <script>
        (function () {
          // Canonical living-icon library — brand-native SVG line-art (design-contract.md → "Living icon
          // library"). Rings are CLOSED full circles (owner decision 2026-07-14, drops the old
          // 5/8 open-arc signature). gd:true paints a stroke/fill in gold; fill:true is a solid dot.
          var RING = "M 48 16 A 32 32 0 1 1 48 80 A 32 32 0 1 1 48 16 Z"; // closed circle, r32 @ (48,48)
          var ICONS = {
            compass: { paths: [{ d: RING }, { d: "M37 59 L54 42", gd: true }, { d: "M59 37 L52 44 L55 47 Z", gd: true }], circles: [{ cx: 48, cy: 48, r: 3.5, fill: true }] },
            pressure: { paths: [{ d: RING }, { d: "M48 48 L48 28" }, { d: "M48 48 L63 55", gd: true }], circles: [{ cx: 48, cy: 48, r: 3.5, fill: true }] },
            insight: { paths: [{ d: "M 48 22 A 18 18 0 1 1 48 58 A 18 18 0 1 1 48 22 Z" }, { d: "M40 55 L56 55" }, { d: "M43 61 L53 61" }, { d: "M42 43 L48 36 L54 43", gd: true }], circles: [] },
            salary: { paths: [{ d: "M26 46 L46 26 L70 26 L70 50 L50 70 Z" }], circles: [{ cx: 58, cy: 38, r: 5, gd: true }] },
            mentorship: { paths: [{ d: "M20 70 Q36 52 52 70" }, { d: "M50 72 Q64 56 78 72", gd: true }], circles: [{ cx: 36, cy: 34, r: 10 }, { cx: 64, cy: 40, r: 9, gd: true }] },
            mentorship2: { paths: [{ d: "M20 70 Q36 52 52 70", gd: true }, { d: "M50 72 Q64 56 78 72" }], circles: [{ cx: 36, cy: 34, r: 9, gd: true }, { cx: 64, cy: 40, r: 10 }] },
            growth: { paths: [{ d: "M22 74 L22 22" }, { d: "M22 74 L76 74" }, { d: "M28 62 L42 50 L54 56 L72 32" }, { d: "M62 32 L72 32 L72 42", gd: true }], circles: [] },
            target: { paths: [{ d: RING }, { d: "M 48 28 A 20 20 0 1 1 48 68 A 20 20 0 1 1 48 28 Z" }], circles: [{ cx: 48, cy: 48, r: 8, gd: true, fill: true }] },
            question: { paths: [{ d: RING }, { d: "M39 40 Q39 30 48 30 Q58 30 58 40 Q58 48 48 51 L48 56", gd: true }], circles: [{ cx: 48, cy: 65, r: 3.2, gd: true, fill: true }] },
            examine: { paths: [{ d: "M 48 12 A 22 22 0 1 1 48 56 A 22 22 0 1 1 48 12 Z" }, { d: "M58 58 L76 76", gd: true }], circles: [] },
            map: { paths: [{ d: "M18 30 L38 22 L58 30 L78 22 L78 66 L58 74 L38 66 L18 74 Z" }, { d: "M38 22 L38 66" }, { d: "M58 30 L58 74" }, { d: "M48 41 L48 52", gd: true }], circles: [{ cx: 48, cy: 36, r: 5, gd: true }] },
            done: { paths: [{ d: RING }, { d: "M34 49 L44 60 L64 37", gd: true }], circles: [] }
          };
          var defaults = {
            num: "1", kicker: "Condition one", heading: "Engaging work", total: "5",
            chips: "Variety,Clear tasks,Real feedback,Freedom", chipCues: "", icon: "compass", iconCue: "",
            sceneIndex: "09 / ENGAGING", theme: "summit", sceneDuration: "8",
          };
          var vars = Object.assign({}, defaults,
            window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {});
          document.getElementById("root").setAttribute("data-theme", vars.theme || "summit");
          document.getElementById("cd__i2-num").textContent = vars.num;
          document.getElementById("cd__i2-kicker").textContent = vars.kicker;
          document.getElementById("cd__i2-heading").textContent = vars.heading;
          document.getElementById("cd__i2-index").textContent = vars.sceneIndex;

          // progress dots (which of the set)
          var n = parseInt(vars.num, 10) || 1;
          var total = Math.max(n, parseInt(vars.total, 10) || 5);
          var phost = document.getElementById("cd__i2-progress");
          for (var k = 1; k <= total; k++) {
            var dot = document.createElement("div");
            dot.className = "pdot" + (k <= n ? " on" : "");
            phost.appendChild(dot);
          }

          // build the living icon from the geometry library
          var svg = document.querySelector("#cd__i2-iconwrap svg");
          // accents = the gold (gd) strokes/dots. Collected but no longer tweened:
          // its only consumer was the closing-beat re-pop removed 2026-07-29. The
          // gold dots still enter with `dots` below; nothing re-marks them after.
          var draws = [], dots = [], accents = [];
          var ic = ICONS[vars.icon] || ICONS.compass;
          var strokeMain = "#0d2437";
          (ic.paths || []).forEach(function (p) {
            var el = document.createElementNS("http://www.w3.org/2000/svg", "path");
            el.setAttribute("d", p.d); el.setAttribute("fill", "none");
            el.setAttribute("stroke", p.gd ? "#eaab2d" : strokeMain);
            el.setAttribute("stroke-width", "4"); el.setAttribute("stroke-linecap", "round"); el.setAttribute("stroke-linejoin", "round");
            el.setAttribute("pathLength", "100"); svg.appendChild(el); draws.push(el);
            if (p.gd) accents.push(el);
          });
          (ic.circles || []).forEach(function (c) {
            var el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            el.setAttribute("cx", c.cx); el.setAttribute("cy", c.cy); el.setAttribute("r", c.r);
            if (c.fill) {
              el.setAttribute("fill", c.gd ? "#eaab2d" : strokeMain); el.setAttribute("stroke", "none"); dots.push(el);
            } else {
              el.setAttribute("fill", "none"); el.setAttribute("stroke", c.gd ? "#eaab2d" : strokeMain);
              el.setAttribute("stroke-width", "4"); el.setAttribute("pathLength", "100"); draws.push(el);
            }
            if (c.gd) accents.push(el);
            svg.appendChild(el);
          });

          var chips = String(vars.chips).split(",").map(function (s) { return s.trim(); }).filter(Boolean);
          var cueArr = String(vars.chipCues || "").split(",").map(function (s) { return parseFloat(s); }).filter(function (v) { return !isNaN(v); });
          var chipEls = [];
          var chost = document.getElementById("cd__i2-chips");
          chips.forEach(function (t) { var d = document.createElement("div"); d.className = "chip"; d.textContent = t; chost.appendChild(d); chipEls.push(d); });

          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });
          var sdur = Math.max(4, parseFloat(vars.sceneDuration) || 8);
          // Furniture paints at t=0 (design-contract.md — no bare first frame at a cut):
          // opacity 0.55 → 1 in ~0.3s so cuts land as a hit, not a dissolve.
          tl.fromTo("#cd__i2-ghost", { opacity: 0.55 }, { opacity: 1, duration: 0.3 }, 0);
          tl.fromTo(["#cd__i2-corner-tl", "#cd__i2-corner-br", "#cd__i2-index", "#cd__i2-brandline"], { opacity: 0.55 }, { opacity: 1, duration: 0.3 }, 0);
          // Entrance settles ≤1.2s (Motion v2, 2026-07-27): hero tweens ≤0.6s,
          // relative order/stagger feel preserved from the v1 choreography.
          tl.fromTo(".pdot", { opacity: 0, scale: 0.6, transformOrigin: "center" }, { opacity: 1, scale: 1, duration: 0.35, stagger: 0.05 }, 0.1);
          tl.fromTo("#cd__i2-num", { opacity: 0, scale: 0.6, transformOrigin: "center" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.2);
          tl.fromTo("#cd__i2-kicker", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4 }, 0.3);
          tl.fromTo("#cd__i2-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 0.35);
          tl.fromTo("#cd__i2-heading", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power4.out" }, 0.4);
          // Living icon draws on (strokeDashoffset) in the compressed entrance slot,
          // or — when `iconCue` is set (Motion v2, 2026-07-27) — the moment the
          // narration names the thing. Gold accents/dots pop last either way.
          var iconCue = parseFloat(String(vars.iconCue || "").trim());
          var drawAt = isNaN(iconCue) ? 0.3 : Math.max(0.4, iconCue);
          // Hold the wrapper invisible until drawAt (render-qa friction log,
          // 2026-07-27 B1): round stroke-linecaps paint a filled dot even at
          // strokeDashoffset 100/zero visible length, so without this the dot
          // is visible from t=0 until the draw-on fires. The stroke-draw itself
          // is the reveal — this just keeps it hidden until its cue.
          tl.set("#cd__i2-iconwrap", { opacity: 0 }, 0);
          tl.set("#cd__i2-iconwrap", { opacity: 1 }, drawAt);
          if (draws.length) tl.fromTo(draws, { strokeDasharray: "100 100", strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.55, ease: "power3.out", stagger: 0.1 }, drawAt);
          if (dots.length) tl.fromTo(dots, { scale: 0, transformOrigin: "center" }, { scale: 1, duration: 0.4, ease: "back.out(2)" }, drawAt + 0.5);
          // detail chips reveal on their spoken cue
          chipEls.forEach(function (el, i) {
            var at = i < cueArr.length ? cueArr[i] : 2.2 + i * 0.9;
            tl.fromTo(el, { opacity: 0, y: 26, scale: 0.9, transformOrigin: "left center" }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.4)" }, at);
            // Compound cue (Motion v2, 2026-07-27): the arriving chip dims the
            // already-settled sibling chips to 0.6; the closing beat restores them.
            if (i > 0) tl.to(chipEls.slice(0, i), { opacity: 0.6, duration: 0.3, ease: "power2.out" }, at);
          });
          // Idle re-animation of settled content remains banned (owner decisions
          // 2026-07-14/15), but the cued closing beat and the scene exit below are
          // REQUIRED (Motion v2, 2026-07-27) — additive NEW beats, never in-place
          // re-marks of the settled heading/badge/chips.
          // Ambient drift (2026-07-15 animacy regression fix): finite translate-only
          // sine yoyo cycles across the whole scene so the frame registers at QA
          // frame sampling after the last cue lands. BACKGROUND LAYERS ONLY —
          // design-contract.md's drift allow-list is ghost/ring decoration, and routing a
          // content tween through this helper is how the living-icon bob got
          // laundered past review.
          var drift = function (sel, ax, ay, per) {
            tl.fromTo(sel, { x: 0, y: 0 }, { x: ax, y: ay, duration: per, ease: "sine.inOut",
              yoyo: true, repeat: Math.max(1, Math.ceil(sdur / per) - 1) }, 0);
          };
          drift("#cd__i2-ghost", 24, 14, 3.2);
          // REMOVED 2026-07-29 (owner): drift("#cd__i2-iconwrap", …), the living-icon bob.
          // (Mechanism: `render-qa/src/check_motion.py`.)
          // Closing beat (Motion v2, 2026-07-27) — one additive resolve in the final
          // second: the dimmed chips restore to full.
          //
          // REMOVED 2026-07-29 (owner): the gold accents' scale 1 → 1.16 → 1 re-pop,
          // which used to open this beat. It was labelled a sanctioned NEW beat, but
          // the accents had already popped at drawAt + 0.5 — re-scaling a settled
          // element is an in-place re-mark by design-contract.md's own definition, and this was
          // the only template whose closing beat re-animated an existing element
          // instead of resolving a new one. The chip restore below IS the closing
          // beat (design-contract.md: "dimmed items restore to full").
          var closeAt = sdur - 1.0;
          if (chipEls.length) tl.to(chipEls, { opacity: 1, duration: 0.4, ease: "power2.out" }, closeAt);
          // Exit (Motion v2, 2026-07-27) — the content layer leaves at −0.35s so the
          // seam reads velocity-matched; furniture (ghost ring, corners, progress
          // dots, index, brandline) never exits.
          var exitAt = sdur - 0.35;
          tl.to(["#cd__i2-num", "#cd__i2-kicker", "#cd__i2-rule", "#cd__i2-heading", "#cd__i2-chips"], { opacity: 0, y: -24, duration: 0.3, ease: "power2.in" }, exitAt);
          tl.to("#cd__i2-iconwrap", { opacity: 0, x: -40, duration: 0.3, ease: "power2.in" }, exitAt);
          // Hard-kill at the boundary (gsap_exit_missing_hard_kill lint).
          tl.set(["#cd__i2-num", "#cd__i2-kicker", "#cd__i2-rule", "#cd__i2-heading", "#cd__i2-chips", "#cd__i2-iconwrap"], { opacity: 0 }, sdur - 0.02);
          window.__timelines["scla-condition__i2"] = tl;
        })();
      </script>
    </template>
  </body>
