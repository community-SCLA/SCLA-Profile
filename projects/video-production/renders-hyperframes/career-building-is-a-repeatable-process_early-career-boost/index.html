    <style>
      /* Brand face — vendored woff2, declared once in the HOST head. Sub-comps
         are cloned INTO this document, so the face resolves for them too. */
      @font-face {
        font-family: "Proxima Nova";
        src: url("assets/fonts/proxima-nova-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Proxima Nova";
        src: url("assets/fonts/proxima-nova-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Proxima Nova";
        src: url("assets/fonts/proxima-nova-900.woff2") format("woff2");
        font-weight: 900;
        font-style: normal;
        font-display: block;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a1e2f;
      }
      body {
        font-family: "Proxima Nova", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      /* Full-bleed fill lives on a CHILD, never on the composition root. */
      #bg {
        position: absolute;
        inset: 0;
        background: #0a1e2f;
      }
      #bg-glow {
        position: absolute;
        left: 900px;
        top: 640px;
        width: 1900px;
        height: 1200px;
        margin: -600px 0 0 -950px;
        background: radial-gradient(
          ellipse at center,
          rgba(51, 147, 214, 0.16) 0%,
          rgba(13, 36, 55, 0.5) 45%,
          rgba(10, 30, 47, 0) 75%
        );
        will-change: transform;
      }
      #bg-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at 50% 52%,
          rgba(10, 30, 47, 0) 55%,
          rgba(10, 30, 47, 0.72) 100%
        );
      }

      /* Persistent program banner. Sits in the top keep-out band that
         tokens.yml `chrome-regions` declares by name for label furniture. */
      #chrome {
        position: absolute;
        left: 130px;
        top: 64px;
        display: flex;
        align-items: center;
        gap: 18px;
        opacity: 0;
      }
      #chrome-mark {
        display: block;
        width: 9px;
        height: 28px;
        background: #eaab2d;
      }
      #chrome-text {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.66);
      }

      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // The banner settles once, then never moves again.
      tl.fromTo("#chrome", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 0.3);

      // One shared ambient breath, on the background GLOW only — never on
      // content. Finite legs (7s half-period x 27 legs = 189s >= data-duration).
      tl.fromTo(
        "#bg-glow",
        { scale: 1, opacity: 0.92 },
        { scale: 1.05, opacity: 1, duration: 7, ease: "sine.inOut", yoyo: true, repeat: 26 }, /* motion-allow: background depth-drift on a non-content layer; the design contract sanctions ambient breath on the background glow only */
        0,
      );

      window.__timelines["main"] = tl;
    </script>
