        <div data-hf-id="hf-gd3w" id="sb03" class="sub"><span data-hf-id="hf-ny6t" id="sb03a">Some small, some major.</span></div>

        <div data-hf-id="hf-57ws" id="sb10" class="sub"><span data-hf-id="hf-8ced" id="sb10a">You wrote your own Career Purpose Statement,</span> <span data-hf-id="hf-0vir" id="sb10b">and explored planning</span> <span data-hf-id="hf-nh09" id="sb10c">in a world shaped by AI.</span></div>
        <div data-hf-id="hf-c5ae" id="sb12" class="sub"><span data-hf-id="hf-fj3e" id="sb12a">Clarity and confidence are not switches you flip once.</span> <span data-hf-id="hf-5e57" id="sb12b">You just built a real foundation.</span></div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Beat starts, COPIED FROM timing.json's vis_start column — computed by
        // make_timing.py from the real clip durations, never hand-tuned. Index
        // 0 is s01. T(n) is beat n's visual start.
        var B = [0, 5.336, 8.47, 13.276, 20.668, 25.082, 27.197, 29.26, 37.096,
                 46.682, 57.104, 59.376, 66.507, 70.111, 72.174, 81.316, 85.73,
                 88.733, 95.576, 108.036, 111.092, 114.304, 116.315, 120.912,
                 127.964, 135.408, 140.292, 142.433, 144.339, 146.323, 149.039,
                 152.303, 158.885, 163.116, 165.127, 167.503, 174.738, 177.872];
        var T = function (n) { return B[n - 1]; };

        // EVERY other absolute time below is a narration WORD ONSET, read from
        // audio_meta.json's per-clip word timestamps offset by that clip's
        // audio_start in timing.json. A beat's own accumulation is spread ACROSS
        // the beat, word by word, so the picture never holds still while the
        // voice keeps speaking — the only compliant answer to a static span.
        // Nothing settled is re-animated: every cue below lands a mark, extends
        // a line, or reveals a clause for the first and only time.

        // Everything the path has not yet earned starts absent. autoAlpha, so a
        // not-yet-laid stone is visibility:hidden and cannot be measured, drawn
        // or read before its beat. Lines that DRAW are held back by their dash
        // offset instead, so their container groups stay visible.
        gsap.set([
          "#h-title", "#h02", "#h03", "#h04", "#h05", "#h06", "#h07", "#h08",
          "#h09", "#h10", "#h11", "#h12", "#h13", "#h14", "#h15", "#h16",
          "#h17", "#h18", "#h19", "#h20", "#h21", "#h22", "#h23", "#h24",
          "#h25", "#h26", "#h27", "#h28", "#h29", "#h30", "#h31", "#h32",
          "#h33", "#h34", "#h35", "#h36", "#h37", "#h38",
          "#sb03", "#sb08", "#sb09", "#sb10", "#sb12", "#sb15", "#sb18",
          "#sb24", "#sb25", "#sb32", "#sb36",
          "#sb03a", "#sb08a", "#sb08b", "#sb09a", "#sb09b", "#sb09c",
          "#sb10a", "#sb10b", "#sb10c", "#sb12a", "#sb12b", "#sb15a",
          "#sb15b", "#sb18a", "#sb24a", "#sb24b", "#sb25a", "#sb32a",
          "#sb32b", "#sb36a",
          "#st01", "#st02", "#st03", "#st04", "#st05", "#st06", "#st07",
          "#st08", "#st09", "#st10", "#st11", "#st12", "#st13", "#st14",
          "#st15", "#st16", "#st17", "#st18", "#st16b", "#st17b", "#st18b",
          "#st19",
          "#boulder-body", "#boulder-label", "#boulder-strike",
          "#sl-r1", "#sl-r2", "#sl-r3", "#sl-r4",
          "#lead1", "#lead2", "#lead3", "#lead4",
          "#sl1", "#sl2", "#sl3", "#sl4",
          "#guide-a", "#guide-b", "#alt-hint",
          "#kept1", "#kept2", "#kept3",
          "#origin", "#origin-ring2", "#lookback", "#fwd-head", "#now-ring",
          "#start-gold", "#start-tick",
          "#f1-pennant", "#f1-label", "#f2-pennant", "#f2-label",
          "#f3-pennant", "#f3-label", "#keep-mark",
          "#wheel-hub", "#node1", "#node2", "#node3", "#node4", "#node5",
          "#node6", "#tk1", "#tk2", "#tk3", "#tk4", "#tk5", "#tk6",
          "#cap1", "#cap2", "#cap3", "#cap4",
          "#par-a", "#par-b", "#par-c", "#par-ext",
          "#week-label", "#trail",
        ], { autoAlpha: 0 });

        // ---- helpers. One-shot entrances only; nothing here repeats, so no
        //      tween in this file can be keep-alive motion.
        // THE SEAM IS ATOMIC. Two constraints meet here and only one shape
        // satisfies both. (1) The heading band may never be empty: the old
        // exit finished 0.04s BEFORE the next heading began, which is the
        // headless frame the review caught at 29.25s and 174.75s. (2) Two
        // headings may never be on screen together: the layout inspector reads
        // BOXES, not opacity, so any cross-fade — however brief — is a fatal
        // content_overlap, and the band is far too shallow to separate two
        // 2-line headings in y. So the swap happens on ONE instant: the
        // outgoing heading is cut and the incoming one is lit in the same
        // frame, and only the 26px settle is animated.
        //
        // Both halves are `tl.set()` on purpose. A zero-duration set records
        // the value it found (autoAlpha 0, from the initial gsap.set) and
        // restores it when the playhead scrubs back before it, so seeking is
        // exact. A `fromTo` whose FROM state is autoAlpha:1 is not an option:
        // gsap renders a fromTo immediately on build, which put all 37
        // headings on frame at t=0.
        var head = function (sel, n) {
          tl.set(sel, { autoAlpha: 1 }, T(n));
          tl.fromTo(sel, { y: 26 }, { y: 0, duration: 0.4, ease: "power3.out" }, T(n));
          if (n < B.length) {
            tl.set(sel, { autoAlpha: 0 }, T(n + 1));
          }
        };
        // A sub-line block opens (its clauses are still hidden) and closes with
        // its beat; each clause is revealed by say() on its own word.
        var openSub = function (sel, t, n) {
          tl.set(sel, { autoAlpha: 1 }, t);
          if (n < B.length) {
            tl.set(sel, { autoAlpha: 0 }, T(n + 1));
          }
        };
        var say = function (sel, t) {
          tl.fromTo(sel, { autoAlpha: 0, y: 12 },
                    { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, t);
        };
        // A new mark ARRIVES on the path and then holds, forever.
        var lay = function (sel, t) {
          tl.fromTo(sel, { autoAlpha: 0, y: -16 },
                    { autoAlpha: 1, y: 0, duration: 0.55, ease: "back.out(1.7)" }, t);
        };
        var fade = function (sel, t) {
          tl.fromTo(sel, { autoAlpha: 0 },
                    { autoAlpha: 1, duration: 0.6, ease: "power2.out" }, t);
        };
        var clear = function (sel, t) {
          tl.to(sel, { autoAlpha: 0, duration: 0.4, ease: "power2.in" }, t);
        };
        // A line is only ever EXTENDED — one pass, then static.
        var draw = function (sel, t, to, dur) {
          tl.to(sel, { strokeDashoffset: to, duration: dur,
                       ease: "power2.inOut" }, t);
        };

        // ---- s01 the myth: one big right choice, alone -------------------
        head("#h-title", 1);
        fade("#trail", 0.1);
        lay("#boulder-body", 1.50);          // "think career success"
        fade("#boulder-label", 3.35);        // "one big right choice"

        // ---- s02 careers do not work that way: the path begins -----------
        head("#h02", 2);
        tl.to("#boulder-body", { fill: "#5f6f96", fillOpacity: 0.4, duration: 0.8,
                                 ease: "power2.out" }, 5.34);
        tl.to("#boulder-label", { fillOpacity: 0.4, duration: 0.8 }, 5.34);
        draw("#route-main", 5.50, 928.3, 1.0);
        lay("#st01", 5.70);
        lay("#st02", 6.90);

        // ---- s03 a series of decisions, some small, some major -----------
        head("#h03", 3);
        openSub("#sb03", 8.60, 3);
        draw("#route-main", 8.70, 714.4, 1.4);
        lay("#st03", 8.90);                  // "built"
        lay("#st04", 9.73);                  // "series"
        lay("#st05", 10.21);                 // "decisions"
        say("#sb03a", 10.95);                // "some small,"

        // ---- s04 what those decisions shape ------------------------------
        head("#h04", 4);
        fade("#cap1", 15.70);                // "skills,"
        fade("#cap2", 16.70);                // "confidence,"
        fade("#cap3", 17.70);                // "relationships,"
        fade("#cap4", 19.08);                // "your opportunities."

        // ---- s05 not a perfect answer ------------------------------------
        head("#h05", 5);
        clear("#cap1", 20.75);
        clear("#cap2", 20.80);
        clear("#cap3", 20.85);
        clear("#cap4", 20.90);
        draw("#route-main", 20.95, 571.3, 1.0);
        lay("#st06", 21.15);
        lay("#st07", 21.99);                 // "track"
        fade("#boulder-strike", 23.40);      // "a perfect answer"

        // ---- s06 it gave you a process -----------------------------------
        head("#h06", 6);
        draw("#route-main", 25.18, 428.4, 0.9);
        lay("#st08", 25.30);
        lay("#st09", 25.90);

        // ---- s07 look back at where you started --------------------------
        head("#h07", 7);
        fade("#origin", 27.35);

        // ---- s08 module 1 ------------------------------------------------
        head("#h08", 8);
        openSub("#sb08", 29.50, 8);
        draw("#f1-pole", 29.86, 0, 1.0);     // "Module"
        lay("#f1-pennant", 31.00);
        say("#sb08a", 31.54);                // "named"
        fade("#f1-label", 33.30);            // "clarified"
        say("#sb08b", 34.90);                // "values,"

        // ---- s09 module 2 ------------------------------------------------
        head("#h09", 9);
        openSub("#sb09", 37.30, 9);
        draw("#f2-pole", 37.70, 0, 1.3);     // "Module"
        lay("#f2-pennant", 39.10);
        say("#sb09a", 39.54);                // "five criteria"
