<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"kicker","type":"string","label":"Eyebrow (e.g. Flip the order)","default":"[[kicker]]"},
    {"id":"aTitle","type":"string","label":"Card A title","default":"[[aTitle]]"},
    {"id":"aSub","type":"string","label":"Card A subtitle","default":"[[aSub]]"},
    {"id":"bTitle","type":"string","label":"Card B title","default":"[[bTitle]]"},
    {"id":"bSub","type":"string","label":"Card B subtitle","default":"[[bSub]]"},
    {"id":"winner","type":"string","label":"Winning card after morph (a | b)","default":"b"},
    {"id":"winnerAfter","type":"string","label":"Relabel winner title after morph (blank keeps title)","default":""},
    {"id":"actions","type":"string","label":"Comma list, one per cue: A | B | morph | note","default":"A,B,morph,note,note,note"},
    {"id":"notes","type":"string","label":"Pipe-separated caption lines consumed by note actions","default":""},
    {"id":"pointCues","type":"string","label":"Per-action reveal times, local sec, comma-separated (compiler-owned)","default":""},
    {"id":"sceneIndex","type":"string","label":"Scene index label","default":"03 / FLIP"},
    {"id":"theme","type":"string","label":"Style package (summit | horizon | cadence)","default":"summit"},
    {"id":"sceneDuration","type":"string","label":"Scene duration in seconds (compiler-maintained)","default":"12"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <!--
      MORPH HAND-OFF — a two-option comparison where the on-screen elements RE-FLOW on a
      spoken cue (FLIP-style), never a cross-fade. Use for "unlearn X, do Y" / before→after /
      wrong-vs-right / reorder-the-priority beats. Cards A and B enter on their cue; on the
      "morph" action the winner (winner:a|b) rises to the top, grows, and turns gold — and may
      relabel its title (winnerAfter) — while the loser drops and dims. Supporting "note"
      captions land on the right on later cues. For a 3-way "compare paths against criteria"
      with a route trace, use scla-career-map instead. Seek-safe: explicit x/y/scale tweens on
      the paused timeline. Cue key: pointCues (one entry per action).
    -->
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "proxima-nova"; src: url("assets/fonts/proxima-nova-400.woff2") format("woff2"); font-weight: 400; font-style: normal; }
        @font-face { font-family: "proxima-nova"; src: url("assets/fonts/proxima-nova-700.woff2") format("woff2"); font-weight: 700; font-style: normal; }
        @font-face { font-family: "proxima-nova"; src: url("assets/fonts/proxima-nova-900.woff2") format("woff2"); font-weight: 900; font-style: normal; }
      </style>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "proxima-nova", system-ui, sans-serif;
        }
        .mp__i3-bg {
          position: absolute;
          inset: 0;
          background: #ffffff;
          background-image:
            linear-gradient(rgba(51, 147, 214, 0.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(51, 147, 214, 0.06) 1px, transparent 1px);
          background-size: 120px 120px;
        }
        #mp__i3-ghost { position: absolute; right: -220px; top: -200px; width: 720px; height: 720px; border-radius: 50%; border: 2px solid rgba(51, 147, 214, 0.1); }
        .mp__i3-corner { position: absolute; width: 34px; height: 34px; border: 3px solid rgba(13, 36, 55, 0.18); }
        #mp__i3-corner-tl { left: 60px; top: 60px; border-right: none; border-bottom: none; }
        #mp__i3-corner-br { right: 60px; bottom: 60px; border-left: none; border-top: none; }
        #mp__i3-kicker { position: absolute; left: 160px; top: 170px; font-size: 26px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #3393d6; }
        #mp__i3-rule { position: absolute; left: 162px; top: 226px; width: 120px; height: 4px; background: #eaab2d; transform-origin: left center; }
        /* Content-driven height (2026-07-28): no fixed box — a title-only card
           (empty aSub/bSub) shrinks to its padding around the title instead of
           rendering a tall mostly-empty panel. min-height fits exactly one
           46px/1.08 title line inside the 40px vertical padding; cards with
           subs grow naturally (and 2-line subs no longer overflow the old
           210px box). Cards stay TOP-anchored in their slots, so the FLIP
           swap's fixed y deltas remain exact for any height. */
        .card { position: absolute; left: 160px; width: 900px; min-height: 130px; border-radius: 12px; background: #f6f6f9; border: 2px solid #cccedf; padding: 40px 46px; box-sizing: border-box; }
        .card .ct { font-size: 46px; font-weight: 900; color: #0d2437; line-height: 1.08; }
        .card .cs { font-size: 40px; font-weight: 400; color: #5f6f96; margin-top: 14px; }
        /* Number markers are circular (owner decision 2026-07-14 — not square corner tabs). */
        /* text-floor-exempt: marker numeral sized by its 66px circle, not body copy */
        .card .cn { position: absolute; left: -26px; top: -26px; width: 66px; height: 66px; border-radius: 50%; background: #0d2437; color: #fff; font-size: 30px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 5px #ffffff; }
        #mp__i3-cardA { top: 300px; }
        #mp__i3-cardB { top: 560px; }
        .card.win { border-color: #eaab2d; background: #fff; box-shadow: 0 0 0 4px rgba(234, 171, 45, 0.18); }
        .card.win .cn { background: #eaab2d; color: #0d2437; }
        #mp__i3-notes { position: absolute; left: 1140px; top: 320px; width: 620px; }
        .mp__i3-note { font-size: 40px; font-weight: 700; color: #292f35; line-height: 1.3; margin-bottom: 26px; padding-left: 34px; position: relative; }
        .mp__i3-note::before { content: ""; position: absolute; left: 0; top: 16px; width: 18px; height: 18px; border-radius: 50%; background: #eaab2d; }
        #mp__i3-index { position: absolute; right: 120px; bottom: 58px; font-size: 20px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #5f6f96; }
        #mp__i3-brandline { position: absolute; left: 120px; bottom: 58px; font-size: 20px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #5f6f96; }
        /* No per-card icon slot. Removed 2026-07-29 on owner instruction — the
           same ban as scla-points' row icons ("no future renders should include
           the icons within this style of illustration"). The `.mci-*` classes
           below survive because #mp__i3-check, the morph's single resolve glyph,
           uses them; it is one closing beat, not an icon per card. */
        /* Closing-beat check (Motion v2) — done-style glyph beside the winner's
           top-right corner after the morph resolves. */
        #mp__i3-check { position: absolute; left: 1030px; top: 262px; width: 60px; height: 60px; opacity: 0; }
        #mp__i3-check svg { position: absolute; inset: 0; }
        #mp__i3-check .mci-stroke { stroke: #0d2437; }
        #mp__i3-check .mci-stroke.mci-gold { stroke: #eaab2d; }
        /* Style packages (design-contract.md "Style packages") — visual layer only; timeline identical */
        #root[data-theme="horizon"] .mp__i3-bg { background-image: radial-gradient(rgba(51, 147, 214, 0.1) 2px, transparent 2px); background-size: 72px 72px; }
        #root[data-theme="horizon"] #mp__i3-rule { background: #3393d6; }
        #root[data-theme="horizon"] .card.win { border-color: #3393d6; box-shadow: 0 0 0 4px rgba(51, 147, 214, 0.18); }
        #root[data-theme="horizon"] .mp__i3-note::before { background: #3393d6; }
        #root[data-theme="horizon"] #mp__i3-check .mci-stroke.mci-gold { stroke: #3393d6; }
        #root[data-theme="cadence"] .mp__i3-bg { background-image: linear-gradient(rgba(51, 147, 214, 0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(51, 147, 214, 0.09) 1px, transparent 1px); background-size: 96px 96px; }
        #root[data-theme="cadence"] .mp__i3-bg::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #eaab2d; }
        #root[data-theme="cadence"] #mp__i3-rule { width: 170px; }
        #root[data-theme="cadence"] .card .cn { background: #eaab2d; color: #0d2437; }
        #root[data-theme="cadence"] #mp__i3-check .mci-stroke.mci-gold { stroke: #eaab2d; }
      </style>

      <div id="root" data-composition-id="scla-morph__i3" data-width="1920" data-height="1080" data-duration="12" data-layout-allow-overflow>
        <div class="mp__i3-bg"></div>
        <div id="mp__i3-ghost" data-layout-allow-overflow></div>
        <div class="mp__i3-corner" id="mp__i3-corner-tl"></div>
        <div class="mp__i3-corner" id="mp__i3-corner-br"></div>
        <div id="mp__i3-kicker">Flip the order</div>
        <div id="mp__i3-rule"></div>
        <div class="card" id="mp__i3-cardA"><div class="cn" id="mp__i3-cnA">1</div><div class="ct" id="mp__i3-ctA">Pick the destination</div><div class="cs" id="mp__i3-csA">choose the job first</div></div>
        <div class="card" id="mp__i3-cardB"><div class="cn" id="mp__i3-cnB">2</div><div class="ct" id="mp__i3-ctB">Know what you optimize for</div><div class="cs" id="mp__i3-csB">define good work first</div></div>
        <!-- Geometry declaration for the run-time note captions (see
             scla-chips.html). These are the captions that sat beside a
             one-card morph on 2026-07-29 with nothing to annotate. -->
        <div id="mp__i3-notes">
          <div class="mp__i3-note" data-slot="notes" data-geometry-repeat="|" data-geometry-proto></div>
        </div>
        <div id="mp__i3-index" data-layout-allow-occlusion>03 / FLIP</div>
        <div id="mp__i3-brandline">SCLA · Lesson System</div>
      </div>

      <script>
        (function () {
          // RING is the shared circle geometry for #mp__i3-check, the morph's single
          // resolve glyph. The per-card ICONS library was deleted 2026-07-29 with
          // the icons slot — see the CSS note above.
          var RING = "M 48 16 A 32 32 0 1 1 48 80 A 32 32 0 1 1 48 16 Z"; // closed circle, r32 @ (48,48)
          var defaults = {
            kicker: "Flip the order", aTitle: "Pick the destination", aSub: "choose the job first",
            bTitle: "Know what you optimize for", bSub: "define good work first", winner: "b", winnerAfter: "",
            actions: "A,B,morph,note,note,note", notes: "", pointCues: "",
            sceneIndex: "03 / FLIP", theme: "summit", sceneDuration: "12",
          };
          var vars = Object.assign({}, defaults,
            window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {});
          document.getElementById("root").setAttribute("data-theme", vars.theme || "summit");
          document.getElementById("mp__i3-kicker").textContent = vars.kicker;
          document.getElementById("mp__i3-ctA").textContent = vars.aTitle;
          document.getElementById("mp__i3-csA").textContent = vars.aSub;
          document.getElementById("mp__i3-ctB").textContent = vars.bTitle;
          document.getElementById("mp__i3-csB").textContent = vars.bSub;
          document.getElementById("mp__i3-index").textContent = vars.sceneIndex;

          // Slot anchors = the cards' TOP edges (CSS #mp__i3-cardA/#mp__i3-cardB tops).
          // Cards are top-anchored with content-driven height (min-height 130px,
          // no fixed box — 2026-07-28), so the FLIP swap below moves top edges by
          // ±(BOT−TOP) and stays exact for any card height; no tween in this
          // timeline assumes the old fixed 210px height. Worst-case content
          // (title + 2-line sub ≈ 228px) still clears the 260px slot pitch.
          var TOP = 300, BOT = 560;
          var cardA = document.getElementById("mp__i3-cardA"), cardB = document.getElementById("mp__i3-cardB");
          var notes = String(vars.notes || "").split("|").map(function (s) { return s.trim(); }).filter(Boolean);
          var noteEls = [];
          var nhost = document.getElementById("mp__i3-notes");
          notes.forEach(function (t) { var d = document.createElement("div"); d.className = "mp__i3-note"; d.textContent = t; nhost.appendChild(d); noteEls.push(d); });
          var actions = String(vars.actions).split(",").map(function (s) { return s.trim(); });
          var cueArr = String(vars.pointCues || "").split(",").map(function (s) { return parseFloat(s); }).filter(function (v) { return !isNaN(v); });

          var SVGNS = "http://www.w3.org/2000/svg";

          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });
          // Furniture paints at t=0 (design-contract.md — no bare first frame at a cut).
          tl.fromTo("#mp__i3-ghost", { opacity: 0.4 }, { opacity: 1, duration: 0.3 }, 0);
          tl.fromTo(["#mp__i3-corner-tl", "#mp__i3-corner-br", "#mp__i3-index", "#mp__i3-brandline"], { opacity: 0.55 }, { opacity: 1, duration: 0.3 }, 0);
          tl.fromTo("#mp__i3-kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.15);
          tl.fromTo("#mp__i3-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.3);
          // cards hidden until their cue
          gsap.set([cardA, cardB], { opacity: 0, y: 0 });

          var noteIdx = 0;
          var morphAt = null;
          actions.forEach(function (act, i) {
            // Uncued fallback spread tightened 2 + i*2.5 → 1.4 + i*1.8 (Motion v2,
            // 2026-07-27) so the FLIP payoff lands mid-scene, not at ~7s.
            var at = i < cueArr.length ? cueArr[i] : 1.4 + i * 1.8;
            if (act === "A") { tl.fromTo(cardA, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, at); }
            else if (act === "B") { tl.fromTo(cardB, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, at); }
            else if (act === "morph") {
              morphAt = at;
              // FLIP reorder: winner rises to TOP and grows+gold; loser drops to BOT and dims.
              var winEl = vars.winner === "a" ? cardA : cardB;
              var loseEl = vars.winner === "a" ? cardB : cardA;
              var winIsBottom = winEl === cardB;
              // winner ends at TOP, loser ends at BOT. If the winner started at the
              // bottom the two swap slots; if the winner is already on top, only the
              // emphasis (scale/gold vs dim) changes — no repositioning.
              tl.to(winEl, { y: winIsBottom ? TOP - BOT : 0, scale: 1.06, duration: 0.7, ease: "power4.inOut" }, at);
              // Loser dims but not below ~0.72: at 0.55 the white-on-navy number
              // marker composited toward the white page fell to ~1.82:1 (contrast
              // warning, owner-approved fix 2026-07-14). Hierarchy still reads from
              // the winner's scale (1.06 vs 0.94) + gold + full opacity.
              tl.to(loseEl, { y: winIsBottom ? BOT - TOP : 0, scale: 0.94, opacity: 0.72, duration: 0.7, ease: "power4.inOut" }, at);
              tl.add(function () { winEl.classList.add("win"); }, at + 0.35);
              if (vars.winnerAfter) {
                var ctEl = winEl.querySelector(".ct");
                tl.to(ctEl, { opacity: 0, duration: 0.25, ease: "power1.in" }, at + 0.4);
                tl.add(function () { ctEl.textContent = vars.winnerAfter; }, at + 0.68);
                tl.to(ctEl, { opacity: 1, duration: 0.3, ease: "power1.out", overwrite: "auto" }, at + 0.72);
              }
            } else if (act === "note") {
              var el = noteEls[noteIdx++];
              if (el) tl.fromTo(el, { opacity: 0, x: 36 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, at);
            }
          });
          // Idle re-animation of settled content remains banned (2026-07-14/15), but
          // the cued closing beat and exit below are REQUIRED (Motion v2, 2026-07-27).
          // Long holds are still covered by staged beats: `actions` cues or a scene split.
          // Ambient drift (2026-07-15 animacy regression fix): the ghost circle
          // drifts in finite translate-only sine yoyo cycles across the whole scene —
          // background texture only. (Cards are left alone — FLIP owns their y/scale.)
          var sdur = Math.max(4, parseFloat(vars.sceneDuration) || 12);
          tl.fromTo("#mp__i3-ghost", { x: 0, y: 0 }, { x: 24, y: 14, duration: 3.2, ease: "sine.inOut",
            yoyo: true, repeat: Math.max(1, Math.ceil(sdur / 3.2) - 1) }, 0);
          // Closing beat (Motion v2, 2026-07-27): a done-style gold check pops beside
          // the winner's top-right corner once the morph has resolved, in the scene's
          // final second — an additive NEW element, never a re-mark of settled content.
          var checkEl = null;
          if (morphAt !== null) {
            checkEl = document.createElement("div");
            checkEl.id = "mp__i3-check";
            checkEl.setAttribute("data-layout-allow-occlusion", "");
            document.getElementById("root").appendChild(checkEl);
            var csvg = document.createElementNS(SVGNS, "svg");
            csvg.setAttribute("viewBox", "0 0 96 96");
            csvg.setAttribute("fill", "none");
            checkEl.appendChild(csvg);
            [{ d: RING }, { d: "M34 49 L44 60 L64 37", gd: true }].forEach(function (p) {
              var el = document.createElementNS(SVGNS, "path");
              el.setAttribute("d", p.d); el.setAttribute("fill", "none");
              el.setAttribute("class", "mci-stroke" + (p.gd ? " mci-gold" : ""));
              el.setAttribute("stroke-width", "5"); el.setAttribute("stroke-linecap", "round"); el.setAttribute("stroke-linejoin", "round");
              csvg.appendChild(el);
            });
            var checkAt = Math.max(morphAt + 1.2, sdur - 1.0);
            tl.fromTo(checkEl, { opacity: 0, scale: 0.3, transformOrigin: "center" },
              { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, checkAt);
          }
          // Exit (Motion v2, 2026-07-27): the content layer slides out at
          // sceneDuration−0.35; furniture (bg, ghost, corners, index, brandline) stays.
          // Cards exit on x (FLIP owns their y/scale); the rest exits upward.
          var exitUp = ["#mp__i3-kicker", "#mp__i3-rule", "#mp__i3-notes"];
          if (checkEl) exitUp.push(checkEl);
          tl.to(exitUp, { opacity: 0, y: -24, duration: 0.3, ease: "power2.in" }, sdur - 0.35);
          tl.to([cardA, cardB], { opacity: 0, x: -40, duration: 0.3, ease: "power2.in" }, sdur - 0.35);
          tl.set(exitUp.concat([cardA, cardB]), { opacity: 0 }, sdur - 0.02);
          window.__timelines["scla-morph__i3"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
