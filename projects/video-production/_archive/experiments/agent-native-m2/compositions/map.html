          const IN = "power4.out";
          const OUT = "power2.in";

          // Arrival: binary reveal + a whip from below. Exit: a short fade up.
          function arrive(sel, t, y, dur) {
            tl.set(sel, { opacity: 1, y: y == null ? 40 : y }, t);
            tl.to(sel, { y: 0, duration: dur == null ? 0.2 : dur, ease: IN }, t);

            if (outSel) leave(outSel, t);
            arrive(inSel, t + 0.3, 40, 0.22);

          leave("#b-q3", 17.95);

          function activate(actSel, nameSel, t) {

          function deactivate(actSel, nameSel, t) {
            tl.to(actSel, { opacity: 0, duration: 0.4, ease: "power2.out" }, t);

          activate("#act-tr", "#name-tr", 44.24);
          leave("#h-pivot", 44.24);

          activate("#act-bl", "#name-bl", 67.19);

          deactivate("#act-bl", "#name-bl", 93.09);
          activate("#act-br", "#name-br", 93.09);
          leave("#h-rebuild", 93.09);
          arrive("#h-forced", 93.45, 40, 0.22);
          swap("#b14", "#b15", 93.75);

          leave("#b15", 103.92);
          tl.set("#b16", { opacity: 1 }, 104.22);
