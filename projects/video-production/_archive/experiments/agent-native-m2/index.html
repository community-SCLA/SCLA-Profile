    <style>
      /* ---- Brand font: Proxima Nova, self-hosted (brand/visual-identity.md) ----
         Declared once here, in the HOST head. Sub-compositions are cloned INTO
         this document, so the face resolves for them too — and an @font-face
         inside a sub-comp <template> would be mangled by CSS scoping. */
      @font-face {
        font-family: "Proxima Nova";
        src: url("assets/fonts/proxima-nova-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Proxima Nova";
        src: url("assets/fonts/proxima-nova-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Proxima Nova";
        src: url("assets/fonts/proxima-nova-900.woff2") format("woff2");
        font-weight: 900;
        font-style: normal;
        font-display: block;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a1e2f;
      }
      body {
        font-family: "Proxima Nova", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      /* Full-bleed fill lives on a CHILD, never on the composition root —
         the producer can drop a root background and render the frame black. */
      #bg {
        position: absolute;
        inset: 0;
        background: #0a1e2f;
      }
      #bg-glow {
        position: absolute;
        left: 50%;
        top: 46%;
        width: 1700px;
        height: 1200px;
        margin: -600px 0 0 -850px;
        background: radial-gradient(
          ellipse at center,
          rgba(51, 147, 214, 0.16) 0%,
          rgba(13, 36, 55, 0.55) 42%,
          rgba(10, 30, 47, 0) 72%
        );
        will-change: transform;
      }
      #bg-grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 120px 120px;
        background-position: 0 0;
      }
      #bg-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 50%, rgba(10, 30, 47, 0) 55%, rgba(6, 20, 32, 0.72) 100%);
      }

      /* Persistent chrome — the program banner, present for the whole runtime. */
      #chrome {
        position: absolute;
        left: 120px;
        top: 62px;
        display: flex;
        align-items: center;
        gap: 20px;
        opacity: 0;
      }
      #chrome-mark {
        display: block;
        width: 10px;
        height: 32px;
        background: #eaab2d;
      }
      #chrome-text {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.66);
      }

      /* Sub-composition slots fill the frame. */
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Chrome settles once, then never moves again.
      tl.fromTo("#chrome", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 0.35);

      // One shared ambient breath on the background GLOW only — never on content.
      // Finite repeats (8s half-period x 25 legs = 200s ~= data-duration).
      tl.fromTo(
        "#bg-glow",
        { scale: 1, opacity: 0.92 },
        { scale: 1.06, opacity: 1, duration: 8, ease: "sine.inOut", yoyo: true, repeat: 24 },
        0,
      );

      window.__timelines["main"] = tl;
    </script>
