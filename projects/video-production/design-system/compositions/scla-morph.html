<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"kicker","type":"string","label":"Eyebrow (e.g. Flip the order)","default":"Flip the order"},
    {"id":"aTitle","type":"string","label":"Card A title","default":"Pick the destination"},
    {"id":"aSub","type":"string","label":"Card A subtitle","default":"choose the job first"},
    {"id":"bTitle","type":"string","label":"Card B title","default":"Know what you optimize for"},
    {"id":"bSub","type":"string","label":"Card B subtitle","default":"define good work first"},
    {"id":"winner","type":"string","label":"Winning card after morph (a | b)","default":"b"},
    {"id":"winnerAfter","type":"string","label":"Relabel winner title after morph (blank keeps title)","default":""},
    {"id":"icons","type":"string","label":"Optional per-card living icons — comma list of 2 ICONS names for cards A,B (empty = none)","default":""},
    {"id":"actions","type":"string","label":"Comma list, one per cue: A | B | morph | note","default":"A,B,morph,note,note,note"},
    {"id":"notes","type":"string","label":"Pipe-separated caption lines consumed by note actions","default":""},
    {"id":"pointCues","type":"string","label":"Per-action reveal times, local sec, comma-separated (compiler-owned)","default":""},
    {"id":"sceneIndex","type":"string","label":"Scene index label","default":"03 / FLIP"},
    {"id":"theme","type":"string","label":"Style package (summit | horizon | cadence)","default":"summit"},
    {"id":"sceneDuration","type":"string","label":"Scene duration in seconds (compiler-maintained)","default":"12"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <!--
      MORPH HAND-OFF — a two-option comparison where the on-screen elements RE-FLOW on a
      spoken cue (FLIP-style), never a cross-fade. Use for "unlearn X, do Y" / before→after /
      wrong-vs-right / reorder-the-priority beats. Cards A and B enter on their cue; on the
      "morph" action the winner (winner:a|b) rises to the top, grows, and turns gold — and may
      relabel its title (winnerAfter) — while the loser drops and dims. Supporting "note"
      captions land on the right on later cues. For a 3-way "compare paths against criteria"
      with a route trace, use scla-career-map instead. Seek-safe: explicit x/y/scale tweens on
      the paused timeline. Cue key: pointCues (one entry per action).
    -->
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "proxima-nova"; src: url("assets/fonts/proxima-nova-400.woff2") format("woff2"); font-weight: 400; font-style: normal; }
        @font-face { font-family: "proxima-nova"; src: url("assets/fonts/proxima-nova-700.woff2") format("woff2"); font-weight: 700; font-style: normal; }
        @font-face { font-family: "proxima-nova"; src: url("assets/fonts/proxima-nova-900.woff2") format("woff2"); font-weight: 900; font-style: normal; }
      </style>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "proxima-nova", system-ui, sans-serif;
        }
        .mp-bg {
          position: absolute;
          inset: 0;
          background: #ffffff;
          background-image:
            linear-gradient(rgba(51, 147, 214, 0.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(51, 147, 214, 0.06) 1px, transparent 1px);
          background-size: 120px 120px;
        }
        #mp-ghost { position: absolute; right: -220px; top: -200px; width: 720px; height: 720px; border-radius: 50%; border: 2px solid rgba(51, 147, 214, 0.1); }
        .mp-corner { position: absolute; width: 34px; height: 34px; border: 3px solid rgba(13, 36, 55, 0.18); }
        #mp-corner-tl { left: 60px; top: 60px; border-right: none; border-bottom: none; }
        #mp-corner-br { right: 60px; bottom: 60px; border-left: none; border-top: none; }
        #mp-kicker { position: absolute; left: 160px; top: 170px; font-size: 26px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #3393d6; }
        #mp-rule { position: absolute; left: 162px; top: 226px; width: 120px; height: 4px; background: #eaab2d; transform-origin: left center; }
        .card { position: absolute; left: 160px; width: 900px; height: 210px; border-radius: 12px; background: #f6f6f9; border: 2px solid #cccedf; padding: 40px 46px; box-sizing: border-box; }
        .card .ct { font-size: 46px; font-weight: 900; color: #0d2437; line-height: 1.08; }
        .card .cs { font-size: 32px; font-weight: 400; color: #5f6f96; margin-top: 14px; }
        /* Number markers are circular (owner decision 2026-07-14 — not square corner tabs). */
        /* text-floor-exempt: marker numeral sized by its 66px circle, not body copy */
        .card .cn { position: absolute; left: -26px; top: -26px; width: 66px; height: 66px; border-radius: 50%; background: #0d2437; color: #fff; font-size: 30px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 5px #ffffff; }
        #mp-cardA { top: 300px; }
        #mp-cardB { top: 560px; }
        .card.win { border-color: #eaab2d; background: #fff; box-shadow: 0 0 0 4px rgba(234, 171, 45, 0.18); }
        .card.win .cn { background: #eaab2d; color: #0d2437; }
        #mp-notes { position: absolute; left: 1140px; top: 320px; width: 620px; }
        .mp-note { font-size: 34px; font-weight: 700; color: #292f35; line-height: 1.3; margin-bottom: 26px; padding-left: 34px; position: relative; }
        .mp-note::before { content: ""; position: absolute; left: 0; top: 16px; width: 18px; height: 18px; border-radius: 50%; background: #eaab2d; }
        #mp-index { position: absolute; right: 120px; bottom: 58px; font-size: 20px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #5f6f96; }
        #mp-brandline { position: absolute; left: 120px; bottom: 58px; font-size: 20px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #5f6f96; }
        /* Optional per-card living icon (Motion v2, 2026-07-27) — geometry from the
           canonical ICONS map (source of truth: scla-condition.html); drawn on with
           each card's entrance. Absent unless the icons variable is set. */
        .mp-cicon { position: absolute; right: 24px; top: 24px; width: 56px; height: 56px; }
        .mp-cicon svg { position: absolute; inset: 0; }
        .mp-cicon .mci-stroke { stroke: #0d2437; }
        .mp-cicon .mci-stroke.mci-gold { stroke: #eaab2d; }
        .mp-cicon .mci-dot { fill: #0d2437; }
        .mp-cicon .mci-dot.mci-gold { fill: #eaab2d; }
        /* Closing-beat check (Motion v2) — done-style glyph beside the winner's
           top-right corner after the morph resolves. */
        #mp-check { position: absolute; left: 1030px; top: 262px; width: 60px; height: 60px; opacity: 0; }
        #mp-check svg { position: absolute; inset: 0; }
        #mp-check .mci-stroke { stroke: #0d2437; }
        #mp-check .mci-stroke.mci-gold { stroke: #eaab2d; }
        /* Style packages (frame.md "Style packages") — visual layer only; timeline identical */
        #root[data-theme="horizon"] .mp-bg { background-image: radial-gradient(rgba(51, 147, 214, 0.1) 2px, transparent 2px); background-size: 72px 72px; }
        #root[data-theme="horizon"] #mp-rule { background: #3393d6; }
        #root[data-theme="horizon"] .card.win { border-color: #3393d6; box-shadow: 0 0 0 4px rgba(51, 147, 214, 0.18); }
        #root[data-theme="horizon"] .mp-note::before { background: #3393d6; }
        #root[data-theme="horizon"] .mp-cicon .mci-stroke.mci-gold { stroke: #3393d6; }
        #root[data-theme="horizon"] .mp-cicon .mci-dot.mci-gold { fill: #3393d6; }
        #root[data-theme="horizon"] #mp-check .mci-stroke.mci-gold { stroke: #3393d6; }
        #root[data-theme="cadence"] .mp-bg { background-image: linear-gradient(rgba(51, 147, 214, 0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(51, 147, 214, 0.09) 1px, transparent 1px); background-size: 96px 96px; }
        #root[data-theme="cadence"] .mp-bg::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #eaab2d; }
        #root[data-theme="cadence"] #mp-rule { width: 170px; }
        #root[data-theme="cadence"] .card .cn { background: #eaab2d; color: #0d2437; }
        #root[data-theme="cadence"] .mp-cicon .mci-stroke.mci-gold { stroke: #eaab2d; }
        #root[data-theme="cadence"] .mp-cicon .mci-dot.mci-gold { fill: #eaab2d; }
        #root[data-theme="cadence"] #mp-check .mci-stroke.mci-gold { stroke: #eaab2d; }
      </style>

      <div id="root" data-composition-id="scla-morph" data-width="1920" data-height="1080" data-duration="12" data-layout-allow-overflow>
        <div class="mp-bg"></div>
        <div id="mp-ghost" data-layout-allow-overflow></div>
        <div class="mp-corner" id="mp-corner-tl"></div>
        <div class="mp-corner" id="mp-corner-br"></div>
        <div id="mp-kicker">Flip the order</div>
        <div id="mp-rule"></div>
        <div class="card" id="mp-cardA"><div class="cn" id="mp-cnA">1</div><div class="ct" id="mp-ctA">Pick the destination</div><div class="cs" id="mp-csA">choose the job first</div></div>
        <div class="card" id="mp-cardB"><div class="cn" id="mp-cnB">2</div><div class="ct" id="mp-ctB">Know what you optimize for</div><div class="cs" id="mp-csB">define good work first</div></div>
        <div id="mp-notes"></div>
        <div id="mp-index" data-layout-allow-occlusion>03 / FLIP</div>
        <div id="mp-brandline">SCLA · Lesson System</div>
      </div>

      <script>
        (function () {
          // Living-icon geometry — mirrored VERBATIM from scla-condition.html's ICONS
          // map (the source of truth; frame.md → "Living icon library"). Edit there
          // first, then re-sync this copy.
          var RING = "M 48 16 A 32 32 0 1 1 48 80 A 32 32 0 1 1 48 16 Z"; // closed circle, r32 @ (48,48)
          var ICONS = {
            compass: { paths: [{ d: RING }, { d: "M37 59 L54 42", gd: true }, { d: "M59 37 L52 44 L55 47 Z", gd: true }], circles: [{ cx: 48, cy: 48, r: 3.5, fill: true }] },
            pressure: { paths: [{ d: RING }, { d: "M48 48 L48 28" }, { d: "M48 48 L63 55", gd: true }], circles: [{ cx: 48, cy: 48, r: 3.5, fill: true }] },
            insight: { paths: [{ d: "M 48 22 A 18 18 0 1 1 48 58 A 18 18 0 1 1 48 22 Z" }, { d: "M40 55 L56 55" }, { d: "M43 61 L53 61" }, { d: "M42 43 L48 36 L54 43", gd: true }], circles: [] },
            salary: { paths: [{ d: "M26 46 L46 26 L70 26 L70 50 L50 70 Z" }], circles: [{ cx: 58, cy: 38, r: 5, gd: true }] },
            mentorship: { paths: [{ d: "M20 70 Q36 52 52 70" }, { d: "M50 72 Q64 56 78 72", gd: true }], circles: [{ cx: 36, cy: 34, r: 10 }, { cx: 64, cy: 40, r: 9, gd: true }] },
            mentorship2: { paths: [{ d: "M20 70 Q36 52 52 70", gd: true }, { d: "M50 72 Q64 56 78 72" }], circles: [{ cx: 36, cy: 34, r: 9, gd: true }, { cx: 64, cy: 40, r: 10 }] },
            growth: { paths: [{ d: "M22 74 L22 22" }, { d: "M22 74 L76 74" }, { d: "M28 62 L42 50 L54 56 L72 32" }, { d: "M62 32 L72 32 L72 42", gd: true }], circles: [] },
            target: { paths: [{ d: RING }, { d: "M 48 28 A 20 20 0 1 1 48 68 A 20 20 0 1 1 48 28 Z" }], circles: [{ cx: 48, cy: 48, r: 8, gd: true, fill: true }] },
            question: { paths: [{ d: RING }, { d: "M39 40 Q39 30 48 30 Q58 30 58 40 Q58 48 48 51 L48 56", gd: true }], circles: [{ cx: 48, cy: 65, r: 3.2, gd: true, fill: true }] },
            examine: { paths: [{ d: "M 48 12 A 22 22 0 1 1 48 56 A 22 22 0 1 1 48 12 Z" }, { d: "M58 58 L76 76", gd: true }], circles: [] },
            done: { paths: [{ d: RING }, { d: "M34 49 L44 60 L64 37", gd: true }], circles: [] }
          };
          var defaults = {
            kicker: "Flip the order", aTitle: "Pick the destination", aSub: "choose the job first",
            bTitle: "Know what you optimize for", bSub: "define good work first", winner: "b", winnerAfter: "",
            icons: "", actions: "A,B,morph,note,note,note", notes: "", pointCues: "",
            sceneIndex: "03 / FLIP", theme: "summit", sceneDuration: "12",
          };
          var vars = Object.assign({}, defaults,
            window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {});
          document.getElementById("root").setAttribute("data-theme", vars.theme || "summit");
          document.getElementById("mp-kicker").textContent = vars.kicker;
          document.getElementById("mp-ctA").textContent = vars.aTitle;
          document.getElementById("mp-csA").textContent = vars.aSub;
          document.getElementById("mp-ctB").textContent = vars.bTitle;
          document.getElementById("mp-csB").textContent = vars.bSub;
          document.getElementById("mp-index").textContent = vars.sceneIndex;

          var TOP = 300, BOT = 560;
          var cardA = document.getElementById("mp-cardA"), cardB = document.getElementById("mp-cardB");
          var notes = String(vars.notes || "").split("|").map(function (s) { return s.trim(); }).filter(Boolean);
          var noteEls = [];
          var nhost = document.getElementById("mp-notes");
          notes.forEach(function (t) { var d = document.createElement("div"); d.className = "mp-note"; d.textContent = t; nhost.appendChild(d); noteEls.push(d); });
          var actions = String(vars.actions).split(",").map(function (s) { return s.trim(); });
          var cueArr = String(vars.pointCues || "").split(",").map(function (s) { return parseFloat(s); }).filter(function (v) { return !isNaN(v); });

          // Optional per-card living icons (Motion v2, 2026-07-27): icons = comma list
          // of up to 2 ICONS names for cards A,B. Empty (the default) = no DOM, no
          // timeline impact — existing builds compile unchanged.
          var SVGNS = "http://www.w3.org/2000/svg";
          function buildIcon(host, name, cls) {
            var ic = ICONS[name];
            if (!ic) return null;
            var wrap = document.createElement("div");
            wrap.className = cls;
            var svg = document.createElementNS(SVGNS, "svg");
            svg.setAttribute("viewBox", "0 0 96 96");
            svg.setAttribute("fill", "none");
            wrap.appendChild(svg);
            host.appendChild(wrap);
            // Hidden until drawIcon() reveals it at its cue (render-qa friction
            // log, 2026-07-27 B1): round stroke-linecaps paint a filled dot even
            // at strokeDashoffset 100/zero visible length, so without this the
            // dot is visible — cascading through the card's own fade-in — before
            // the draw-on fires.
            wrap.style.opacity = "0";
            var draws = [], dots = [];
            (ic.paths || []).forEach(function (p) {
              var el = document.createElementNS(SVGNS, "path");
              el.setAttribute("d", p.d); el.setAttribute("fill", "none");
              el.setAttribute("class", "mci-stroke" + (p.gd ? " mci-gold" : ""));
              el.setAttribute("stroke-width", "4"); el.setAttribute("stroke-linecap", "round"); el.setAttribute("stroke-linejoin", "round");
              el.setAttribute("pathLength", "100"); svg.appendChild(el); draws.push(el);
            });
            (ic.circles || []).forEach(function (c) {
              var el = document.createElementNS(SVGNS, "circle");
              el.setAttribute("cx", c.cx); el.setAttribute("cy", c.cy); el.setAttribute("r", c.r);
              if (c.fill) {
                el.setAttribute("class", "mci-dot" + (c.gd ? " mci-gold" : "")); el.setAttribute("stroke", "none"); dots.push(el);
              } else {
                el.setAttribute("class", "mci-stroke" + (c.gd ? " mci-gold" : "")); el.setAttribute("fill", "none");
                el.setAttribute("stroke-width", "4"); el.setAttribute("pathLength", "100"); draws.push(el);
              }
              svg.appendChild(el);
            });
            return { wrap: wrap, draws: draws, dots: dots };
          }
          var iconNames = String(vars.icons || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
          var iconA = iconNames[0] ? buildIcon(cardA, iconNames[0], "mp-cicon") : null;
          var iconB = iconNames[1] ? buildIcon(cardB, iconNames[1], "mp-cicon") : null;

          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });
          // Living-icon draw-on, fired with its card's entrance (strokeDashoffset,
          // gold dots pop last — same grammar as scla-condition).
          function drawIcon(icon, at) {
            if (!icon) return;
            tl.set(icon.wrap, { opacity: 1 }, at);
            if (icon.draws.length) tl.fromTo(icon.draws, { strokeDasharray: "100 100", strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.55, ease: "power3.out", stagger: 0.13 }, at);
            if (icon.dots.length) tl.fromTo(icon.dots, { scale: 0, transformOrigin: "center" }, { scale: 1, duration: 0.4, ease: "back.out(2)" }, at + 0.45);
          }
          // Furniture paints at t=0 (frame.md — no bare first frame at a cut).
          tl.fromTo("#mp-ghost", { opacity: 0.4 }, { opacity: 1, duration: 0.3 }, 0);
          tl.fromTo(["#mp-corner-tl", "#mp-corner-br", "#mp-index", "#mp-brandline"], { opacity: 0.55 }, { opacity: 1, duration: 0.3 }, 0);
          tl.fromTo("#mp-kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.35);
          tl.fromTo("#mp-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.5);
          // cards hidden until their cue
          gsap.set([cardA, cardB], { opacity: 0, y: 0 });

          var noteIdx = 0;
          var morphAt = null;
          actions.forEach(function (act, i) {
            // Uncued fallback spread tightened 2 + i*2.5 → 1.4 + i*1.8 (Motion v2,
            // 2026-07-27) so the FLIP payoff lands mid-scene, not at ~7s.
            var at = i < cueArr.length ? cueArr[i] : 1.4 + i * 1.8;
            if (act === "A") { tl.fromTo(cardA, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, at); drawIcon(iconA, at + 0.15); }
            else if (act === "B") { tl.fromTo(cardB, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, at); drawIcon(iconB, at + 0.15); }
            else if (act === "morph") {
              morphAt = at;
              // FLIP reorder: winner rises to TOP and grows+gold; loser drops to BOT and dims.
              var winEl = vars.winner === "a" ? cardA : cardB;
              var loseEl = vars.winner === "a" ? cardB : cardA;
              var winIsBottom = winEl === cardB;
              // winner ends at TOP, loser ends at BOT. If the winner started at the
              // bottom the two swap slots; if the winner is already on top, only the
              // emphasis (scale/gold vs dim) changes — no repositioning.
              tl.to(winEl, { y: winIsBottom ? TOP - BOT : 0, scale: 1.06, duration: 0.7, ease: "power4.inOut" }, at);
              // Loser dims but not below ~0.72: at 0.55 the white-on-navy number
              // marker composited toward the white page fell to ~1.82:1 (contrast
              // warning, owner-approved fix 2026-07-14). Hierarchy still reads from
              // the winner's scale (1.06 vs 0.94) + gold + full opacity.
              tl.to(loseEl, { y: winIsBottom ? BOT - TOP : 0, scale: 0.94, opacity: 0.72, duration: 0.7, ease: "power4.inOut" }, at);
              tl.add(function () { winEl.classList.add("win"); }, at + 0.35);
              if (vars.winnerAfter) {
                var ctEl = winEl.querySelector(".ct");
                tl.to(ctEl, { opacity: 0, duration: 0.25, ease: "power1.in" }, at + 0.4);
                tl.add(function () { ctEl.textContent = vars.winnerAfter; }, at + 0.68);
                tl.to(ctEl, { opacity: 1, duration: 0.3, ease: "power1.out", overwrite: "auto" }, at + 0.72);
              }
            } else if (act === "note") {
              var el = noteEls[noteIdx++];
              if (el) tl.fromTo(el, { opacity: 0, x: 36 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, at);
            }
          });
          // Idle re-animation of settled content remains banned (2026-07-14/15), but
          // the cued closing beat and exit below are REQUIRED (Motion v2, 2026-07-27).
          // Long holds are still covered by staged beats: `actions` cues or a scene split.
          // Ambient drift (2026-07-15 animacy regression fix): the ghost circle
          // drifts in finite translate-only sine yoyo cycles across the whole scene —
          // background texture only. (Cards are left alone — FLIP owns their y/scale.)
          var sdur = Math.max(4, parseFloat(vars.sceneDuration) || 12);
          tl.fromTo("#mp-ghost", { x: 0, y: 0 }, { x: 24, y: 14, duration: 3.2, ease: "sine.inOut",
            yoyo: true, repeat: Math.max(1, Math.ceil(sdur / 3.2) - 1) }, 0);
          // Closing beat (Motion v2, 2026-07-27): a done-style gold check pops beside
          // the winner's top-right corner once the morph has resolved, in the scene's
          // final second — an additive NEW element, never a re-mark of settled content.
          var checkEl = null;
          if (morphAt !== null) {
            checkEl = document.createElement("div");
            checkEl.id = "mp-check";
            checkEl.setAttribute("data-layout-allow-occlusion", "");
            document.getElementById("root").appendChild(checkEl);
            var csvg = document.createElementNS(SVGNS, "svg");
            csvg.setAttribute("viewBox", "0 0 96 96");
            csvg.setAttribute("fill", "none");
            checkEl.appendChild(csvg);
            [{ d: RING }, { d: "M34 49 L44 60 L64 37", gd: true }].forEach(function (p) {
              var el = document.createElementNS(SVGNS, "path");
              el.setAttribute("d", p.d); el.setAttribute("fill", "none");
              el.setAttribute("class", "mci-stroke" + (p.gd ? " mci-gold" : ""));
              el.setAttribute("stroke-width", "5"); el.setAttribute("stroke-linecap", "round"); el.setAttribute("stroke-linejoin", "round");
              csvg.appendChild(el);
            });
            var checkAt = Math.max(morphAt + 1.2, sdur - 1.0);
            tl.fromTo(checkEl, { opacity: 0, scale: 0.3, transformOrigin: "center" },
              { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, checkAt);
          }
          // Exit (Motion v2, 2026-07-27): the content layer slides out at
          // sceneDuration−0.35; furniture (bg, ghost, corners, index, brandline) stays.
          // Cards exit on x (FLIP owns their y/scale); the rest exits upward.
          var exitUp = ["#mp-kicker", "#mp-rule", "#mp-notes"];
          if (checkEl) exitUp.push(checkEl);
          tl.to(exitUp, { opacity: 0, y: -24, duration: 0.3, ease: "power2.in" }, sdur - 0.35);
          tl.to([cardA, cardB], { opacity: 0, x: -40, duration: 0.3, ease: "power2.in" }, sdur - 0.35);
          tl.set(exitUp.concat([cardA, cardB]), { opacity: 0 }, sdur - 0.02);
          window.__timelines["scla-morph"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
