<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"label","type":"string","label":"Section label","default":"[[label]]"},
    {"id":"heading","type":"string","label":"Heading","default":"[[heading]]"},
    {"id":"step1","type":"string","label":"Step 1 — ONE line (<=560px); a node label, not prose","default":"[[step1]]","maxLines":1},
    {"id":"step2","type":"string","label":"Step 2 — ONE line (<=500px, side caption)","default":"[[step2]]","maxLines":1},
    {"id":"step3","type":"string","label":"Step 3 — ONE line (<=560px); a 2nd line lands on the sub-beat","default":"[[step3]]","maxLines":1},
    {"id":"step4","type":"string","label":"Step 4 — ONE line (<=500px, side caption; empty to hide)","default":"[[step4]]","maxLines":1},
    {"id":"sceneIndex","type":"string","label":"Scene index label","default":"12 / THE LOOP"},
    {"id":"theme","type":"string","label":"Style package (summit | horizon | cadence)","default":"summit"},
    {"id":"subBeats","type":"string","label":"Sub-beats — narration-synced live line, pipe-separated (empty = off); ONE line each","default":"","maxLines":1},
    {"id":"subCues","type":"string","label":"Per-sub-beat reveal times, local sec, comma-separated (compiler-owned)","default":""},
    {"id":"sceneDuration","type":"string","label":"Scene duration in seconds (compiler-maintained; times the late-phase resolve)","default":"10"},
    {"id":"stepCues","type":"string","label":"Per-step activation times, local sec, comma-separated (empty = default spread)","default":""}
  ]'
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "proxima-nova"; src: url("assets/fonts/proxima-nova-400.woff2") format("woff2"); font-weight: 400; font-style: normal; }
        @font-face { font-family: "proxima-nova"; src: url("assets/fonts/proxima-nova-700.woff2") format("woff2"); font-weight: 700; font-style: normal; }
        @font-face { font-family: "proxima-nova"; src: url("assets/fonts/proxima-nova-900.woff2") format("woff2"); font-weight: 900; font-style: normal; }
      </style>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "proxima-nova", system-ui, sans-serif;
        }
        .lp-bg {
          position: absolute;
          inset: 0;
          background: #ffffff;
        }
        .lp-bg::after {
          content: "";
          position: absolute;
          inset: 0;
          background-image: radial-gradient(rgba(51, 147, 214, 0.14) 2px, transparent 2px);
          background-size: 64px 64px;
        }
        #lp-panel {
          position: absolute;
          left: 0;
          top: 0;
          right: 0;
          height: 320px;
          background: #f0f2f9;
          border-bottom: 2px solid #cccedf;
        }
        #lp-ghost-num {
          position: absolute;
          right: 60px;
          top: -60px;
          font-size: 380px;
          font-weight: 900;
          color: rgba(51, 147, 214, 0.12);
          line-height: 1;
        }
        #lp-head {
          position: absolute;
          left: 120px;
          top: 84px;
        }
        #lp-label-row {
          display: flex;
          align-items: center;
          gap: 18px;
        }
        #lp-tick {
          width: 46px;
          height: 4px;
          background: #eaab2d;
          transform-origin: left center;
        }
        #lp-label {
          font-size: 24px;
          font-weight: 700;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: #3393d6;
        }
        #lp-heading {
          margin-top: 16px;
          font-size: 66px;
          font-weight: 900;
          color: #0d2437;
          line-height: 1.08;
        }
        /* The ring — SCLA's house oval motif, doing double duty as the cycle track.
           Full-frame SVG behind the nodes; the gold arc draws clockwise and an
           arrowhead on the upper-left segment closes step 4 back to step 1. */
        #lp-ring {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
        }
        .lp-track { fill: none; stroke: #cccedf; stroke-width: 4; opacity: 0; }
        .lp-fill {
          fill: none;
          stroke: #3393d6;
          stroke-width: 4;
          stroke-linecap: round;
          stroke-dasharray: 100 100;
          stroke-dashoffset: 100;
        }
        .lp-arrow { fill: #eaab2d; opacity: 0; }
        .lp-node {
          position: absolute;
          width: 120px;
          height: 120px;
          border-radius: 50%;
          background: #ffffff;
          border: 4px solid #0d2437;
          display: grid;
          place-items: center;
          font-size: 44px;
          font-weight: 900;
          color: #0d2437;
        }
        .lp-node .lp-node-fill {
          position: absolute;
          inset: -4px;
          border-radius: 50%;
          background: #eaab2d;
        }
        .lp-node span {
          position: relative;
        }
        .lp-caption {
          position: absolute;
          width: 560px;
          font-size: 40px;
          font-weight: 700;
          color: #292f35;
          line-height: 1.3;
        }
        /* Nodes ride the ellipse at 12 / 3 / 6 / 9 o'clock; captions radiate outward.
           GEOMETRY BUDGET (2026-07-29 — this is why the numbers are what they are).
           Vertical room runs from the panel edge (y=320) to content-bottom (y=960),
           and every caption is ONE line by contract (`maxLines: 1` in the schema
           above): a label orbiting a node is a label, not prose. At the 40px body
           floor one line is 52px, which leaves:
               panel 320 | cap-1 349-401 | node-1 425-545 | ring cy=615 ry=130
                         | node-3 685-805 | cap-3 829-881 | content-bottom 960
           — a >=24px gutter at every seam. The shipped 2026-07-29 build ran the
           ring 25px lower with a 320px caption box, so `step3` wrapped to two lines
           and printed straight through the sub-beat, which then lived at y=906.
           The sub-beat has since moved into the header panel (see .lp-subbeat), so
           the 79px below cap-3 is now pure slack rather than a shared seam — do not
           spend it by dropping the ring back down. cap-1 is BOTTOM-anchored so it
           grows away from the node rather than into it. check_geometry.py holds all
           of this; do not nudge a number here without re-running it. */
        #lp-node-1 { left: 900px; top: 425px; }
        #lp-node-2 { left: 1180px; top: 555px; }
        #lp-node-3 { left: 900px; top: 685px; }
        #lp-node-4 { left: 620px; top: 555px; }
        #lp-cap-1 { left: 680px; bottom: 679px; text-align: center; }
        #lp-cap-3 { left: 680px; top: 829px; text-align: center; }
        /* Side captions clear the safe area: 1324 + 500 = 1824 <= 1848, and the
           mirrored right offset puts cap-4's left edge at 96. */
        #lp-cap-2 { left: 1324px; top: 589px; width: 500px; text-align: left; }
        #lp-cap-4 { right: 1324px; top: 589px; width: 500px; text-align: right; }
        #lp-index {
          position: absolute;
          right: 120px;
          bottom: 58px;
          font-size: 20px;
          font-weight: 700;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: #5f6f96;
        }
        #lp-brandline {
          position: absolute;
          left: 120px;
          bottom: 58px;
          font-size: 20px;
          font-weight: 700;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: #5f6f96;
        }
        /* Sub-beats — narration-synced live line (mirrors scla-steps; dead-hold fix).
           One beat visible at a time; absent unless subBeats is set.

           IN THE HEADER PANEL, NOT UNDER THE DIAGRAM (owner, 2026-07-29). It sat
           centred at bottom:126px, directly beneath the ring, where a line like
           "Same four steps, every time" read as a caption ON the illustration —
           so a three-node loop looked like it was claiming to show four steps.
           It is a subheading of the scene's statement, so it belongs under the
           heading: same left edge (120px), same left alignment, inside the panel.
           Budget: head bottoms out at 200 (label 29 + margin 16 + heading 71 from
           top:84), this line runs 224-272, panel border is at 318 — a 24px gutter
           above and 46px below. Width stops at 1300 so it never reaches the ghost
           numeral. */
        .lp-subbeat {
          position: absolute;
          left: 120px;
          top: 224px;
          width: 1180px;
          text-align: left;
          font-size: 40px;
          font-weight: 700;
          line-height: 1.2;
          color: #292f35;
          opacity: 0;
        }
        /* Style packages (design-contract.md "Style packages") — visual layer only; timeline identical */
        #root[data-theme="horizon"] #lp-panel { background: #f6f6f9; }
        #root[data-theme="horizon"] .lp-bg::after { background-image: radial-gradient(rgba(51, 147, 214, 0.1) 2px, transparent 2px); }
        #root[data-theme="horizon"] #lp-tick { background: #3393d6; }
        #root[data-theme="horizon"] #lp-ghost-num { color: rgba(234, 171, 45, 0.14); }
        #root[data-theme="horizon"] .lp-node .lp-node-fill { background: #3393d6; }
        #root[data-theme="horizon"] .lp-node span { color: #ffffff; }
        #root[data-theme="cadence"] #lp-panel { background: radial-gradient(140% 160% at 24% 30%, #0d2437 0%, #0a1e2f 80%); border-bottom: 4px solid #eaab2d; }
        #root[data-theme="cadence"] #lp-label { color: #eaab2d; }
        #root[data-theme="cadence"] #lp-tick { background: #3393d6; }
        #root[data-theme="cadence"] #lp-heading { color: #ffffff; }
        #root[data-theme="cadence"] #lp-ghost-num { color: rgba(234, 171, 45, 0.18); }
        #root[data-theme="cadence"] .lp-fill { stroke: #eaab2d; }
        /* The sub-beat moved into the panel (2026-07-29), so it now inherits the
           panel's background per theme — on cadence that panel is navy. */
        #root[data-theme="cadence"] .lp-subbeat { color: #bcd3e4; }
      </style>

      <div id="root" data-composition-id="scla-loop" data-width="1920" data-height="1080" data-duration="8">
        <div class="lp-bg"></div>
        <div id="lp-panel"></div>
        <div id="lp-ghost-num" data-layout-allow-overflow data-layout-allow-occlusion data-layout-allow-overlap>4</div>
        <div id="lp-head">
          <div id="lp-label-row">
            <div id="lp-tick"></div>
            <div id="lp-label" data-slot="label" data-layout-allow-occlusion>In practice, a simple loop</div>
          </div>
          <h2 id="lp-heading" data-slot="heading" data-layout-allow-occlusion>Human and AI, together</h2>
        </div>
        <svg id="lp-ring" viewBox="0 0 1920 1080" data-layout-allow-occlusion>
          <path class="lp-track" d="M 960 485 A 280 130 0 0 1 1240 615 A 280 130 0 0 1 960 745 A 280 130 0 0 1 680 615 A 280 130 0 0 1 960 485 Z" />
          <path id="lp-fill" class="lp-fill" pathLength="100" d="M 960 485 A 280 130 0 0 1 1240 615 A 280 130 0 0 1 960 745 A 280 130 0 0 1 680 615 A 280 130 0 0 1 960 485 Z" />
          <polygon id="lp-arrow" class="lp-arrow" points="798,510 770,500 766,524" />
        </svg>
        <div class="lp-node" id="lp-node-1" data-present-if="step1"><div class="lp-node-fill"></div><span>1</span></div>
        <div class="lp-node" id="lp-node-2" data-present-if="step2"><div class="lp-node-fill"></div><span>2</span></div>
        <div class="lp-node" id="lp-node-3" data-present-if="step3"><div class="lp-node-fill"></div><span>3</span></div>
        <div class="lp-node" id="lp-node-4" data-present-if="step4"><div class="lp-node-fill"></div><span>4</span></div>
        <div class="lp-caption" id="lp-cap-1" data-slot="step1">A human question</div>
        <div class="lp-caption" id="lp-cap-2" data-slot="step2">An AI draft</div>
        <div class="lp-caption" id="lp-cap-3" data-slot="step3">A human review</div>
        <div class="lp-caption" id="lp-cap-4" data-slot="step4">A better result than either alone</div>
        <!-- Geometry declaration for the sub-beat line the script creates at run
             time. Empty and opacity:0, so it paints nothing; it exists so
             check_geometry.py can see the box those lines occupy. A box only the
             browser knows about is a box no gate can grade — which is exactly
             how this element collided with #lp-cap-3 on 2026-07-29. -->
        <div class="lp-subbeat" id="lp-subbeat-proto" data-slot="subBeats" data-geometry-proto></div>
        <div id="lp-index" data-slot="sceneIndex" data-layout-allow-occlusion>12 / THE LOOP</div>
        <div id="lp-brandline">SCLA · Lesson System</div>
      </div>

      <script>
        (function () {
          const defaults = {
            label: "In practice, a simple loop",
            heading: "Human and AI, together",
            step1: "A human question",
            step2: "An AI draft",
            step3: "A human review",
            step4: "A better result than either alone",
            sceneIndex: "12 / THE LOOP",
            theme: "summit",
            sceneDuration: "10",
            stepCues: "",
          };
          const vars = Object.assign(
            {},
            defaults,
            window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {},
          );
          document.getElementById("root").setAttribute("data-theme", vars.theme || "summit");
          document.getElementById("lp-label").textContent = vars.label;
          document.getElementById("lp-heading").textContent = vars.heading;
          document.getElementById("lp-index").textContent = vars.sceneIndex;
          const steps = [vars.step1, vars.step2, vars.step3, vars.step4];
          let visible = 0;
          steps.forEach(function (s, i) {
            const node = document.getElementById("lp-node-" + (i + 1));
            const cap = document.getElementById("lp-cap-" + (i + 1));
            if (s && String(s).trim() !== "") {
              cap.textContent = s;
              visible += 1;
            } else {
              node.remove();
              cap.remove();
            }
          });
          document.getElementById("lp-ghost-num").textContent = String(visible);

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });
          // Entrance compressed to settle ≤1.2s (Motion v2, 2026-07-27).
          tl.fromTo("#lp-panel", { yPercent: -100 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, 0);
          tl.fromTo("#lp-tick", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.3);
          tl.fromTo("#lp-label", { opacity: 0, x: -32 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.4);
          tl.fromTo("#lp-heading", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power4.out" }, 0.45);
          tl.fromTo("#lp-ghost-num", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.5);
          tl.fromTo(".lp-track", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 0.8);
          // Explicit activation cues (local seconds) fire each node/caption the moment
          // the narration reaches that step. Empty → default even spread. The gold arc
          // advances in quarter-arc SEGMENTS — one per step cue (Motion v2, 2026-07-27;
          // the old single stretched draw slowed with scene length and read as drag) —
          // then the final segment + arrowhead close the loop 4 → 1 as the cued
          // closing beat. design-contract.md → "Reveal on the spoken cue".
          const stepCues = String(vars.stepCues || "")
            .split(",")
            .map(function (s) { return Number(s.trim()); })
            .filter(function (v) { return !isNaN(v); });
          const at = [];
          for (let i = 0; i < visible; i++) {
            at.push(stepCues.length ? Math.max(0.4, stepCues[i]) : 1.0 + i * 0.46);
          }
          const lastAt = visible ? at[visible - 1] : 1.0;
          const sceneDur = Math.max(4, Number(vars.sceneDuration) || 10);
          // Segmented draw: node i+1 sits at arc progress i*25 (12/3/6/9 o'clock), so a
          // quarter-arc advances TO node i the moment stepCue i fires. Seek-safe: each
          // segment is an explicit fromTo between fixed offsets.
          for (let i = 1; i < visible; i++) {
            tl.fromTo(
              "#lp-fill",
              { strokeDashoffset: 100 - (i - 1) * 25 },
              { strokeDashoffset: 100 - i * 25, duration: 0.6, ease: "power2.out" },
              at[i],
            );
          }
          // SCAFFOLD EARLY, LABEL ON CUE (2026-07-29). The whole node used to
          // wait for its spoken cue, and on a scene whose narration names the
          // steps only in its second half that left a bare ellipse on screen
          // for ~5 of 10 seconds — caught on the precheck contact sheet, which
          // sampled scene-19 at its midpoint and found one sub-beat line
          // floating over an empty ring. design-contract.md → "Every scene earns its
          // seconds". So the EMPTY numbered rings now enter with the track and
          // the diagram reads as a structure from the first second; the gold
          // fill and the caption still land exactly on the spoken cue, which is
          // where the reveal contract actually lives.
          for (let i = 0; i < visible; i++) {
            tl.fromTo(
              "#lp-node-" + (i + 1),
              { opacity: 0, scale: 0.4 },
              { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" },
              Math.min(0.9 + i * 0.14, Math.max(0.4, at[i])),
            );
          }
          for (let i = 0; i < visible; i++) {
            tl.fromTo(
              "#lp-node-" + (i + 1) + " .lp-node-fill",
              { scale: 0, opacity: 0 },
              { scale: 1, opacity: 1, duration: 0.38, ease: "power3.out" },
              at[i],
            );
            tl.fromTo(
              "#lp-cap-" + (i + 1),
              { opacity: 0, y: 28 },
              { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
              at[i] + 0.12,
            );
          }
          // Closing beat (Motion v2, 2026-07-27): the final arc segment draws home and
          // the return arrowhead fades in on the upper-left segment, in the scene's
          // final second (after the last step cue). Arrow is opacity-only — scaling an
          // SVG polygon whose coords sit far from the origin translates it under
          // GSAP's transform model.
          const closeAt = Math.max(lastAt + 0.8, sceneDur - 1.0);
          tl.fromTo(
            "#lp-fill",
            { strokeDashoffset: 100 - (visible - 1) * 25 },
            { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
            closeAt - 0.5,
          );
          tl.fromTo("#lp-arrow", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, closeAt);
          // Furniture paints at t=0 (design-contract.md — no bare first frame at a cut).
          tl.fromTo(["#lp-index", "#lp-brandline"], { opacity: 0.55 }, { opacity: 1, duration: 0.3 }, 0);
          // Ambient drift cycles (mirrors scla-steps): the ghost numeral drifts
          // horizontally in finite translate-only sine yoyo cycles across the whole
          // scene (x-only — its entrance owns y) so the decorative layer registers at
          // QA frame sampling even between cues.
          tl.fromTo("#lp-ghost-num", { x: 0 }, { x: 20, duration: 3.2, ease: "sine.inOut",
            yoyo: true, repeat: Math.max(1, Math.ceil(sceneDur / 3.2) - 1) }, 0);  /* motion-allow: depth-drift on the oversized ghost numeral — decorative texture layer, never content */
          // Sub-beats: a cued live line that swaps text on each spoken cue — covers
          // narration spans between primary reveals (mirrors scla-steps). Empty subBeats
          // (the default) = no DOM, no timeline impact. Seek-safe: tween-only swaps.
          const subBeats = String(vars.subBeats || "").split("|").map(function (s) { return s.trim(); }).filter(Boolean);
          const subCues = String(vars.subCues || "").split(",").map(function (s) { return Number(s.trim()); }).filter(function (v) { return !isNaN(v); });
          if (subBeats.length && subCues.length === subBeats.length) {
            subBeats.forEach(function (text, i) {
              const el = document.createElement("div");
              el.className = "lp-subbeat";
              el.setAttribute("data-layout-allow-occlusion", "");
              el.textContent = text;
              document.getElementById("root").appendChild(el);
              const cueAt = Math.max(0.4, subCues[i]);
              tl.fromTo(el, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, cueAt);
              if (i + 1 < subBeats.length) {
                const out = Math.max(cueAt + 0.5, Math.max(0.4, subCues[i + 1]) - 0.35);
                tl.to(el, { opacity: 0, y: -18, duration: 0.3, ease: "power2.in" }, out);
              }
            });
          }
          // Exit (Motion v2, 2026-07-27): the content layer slides out at
          // sceneDuration−0.35; furniture (bg, panel, index, brandline) stays put.
          const exitEls = ["#lp-head", "#lp-ghost-num", "#lp-ring", ".lp-node", ".lp-caption"];
          if (subBeats.length && subCues.length === subBeats.length) exitEls.push(".lp-subbeat");
          tl.to(exitEls, { opacity: 0, y: -24, duration: 0.3, ease: "power2.in" }, sceneDur - 0.35);
          tl.set(exitEls, { opacity: 0 }, sceneDur - 0.02);
          window.__timelines["scla-loop"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
