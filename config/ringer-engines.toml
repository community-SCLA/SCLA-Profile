# SCLA's Ringer config. Claude is the ONLY engine. There is no second option.
#
# Canonical copy: config/ringer-engines.toml (this file, tracked in git).
# Live copy:      ~/.config/ringer/config.toml (wiped by a Codespace rebuild).
# Edit here, then run: bash scripts/setup-ringer.sh --force
#
# No secrets in this file. Claude Code auth is OAuth; everything else comes from
# Infisical at run time via scripts/with-secrets.sh.

# Swarm identity. The repo-root .fleet-agent file ("scla-profile") overrides this.
identity_default = "scla-profile"

# Run state lives under <state_dir>/runs/<run_id>.json.
state_dir = "~/.ringer"

# First localhost port tried for the per-run dashboard; scans 49 more if busy.
dashboard_port_base = 8787

# Full-access gate. A task with "full_access": true fails unless this is true.
# Claude Code has no OS sandbox, so true means workers can run any command in
# this container. Turn on only for tasks that must render, build, or commit.
allow_full_access = true

[update]
# auto = true
# check_interval_s = 3600

[eval]
backend = "jsonl"
jsonl_path = "~/.ringer/runs.jsonl"


# ─────────────────────────────────────────────────────────────────────────────
# THE ENGINE — Claude Code CLI. Every task must set "engine": "claude".
# Install: npm install -g @anthropic-ai/claude-code, then run `claude` and sign in.
# Verified against Claude Code v2.1.220.
#
# MODELS — set per task with "model". Any of the three may run a worker task or a
# checker task; a checker is just a task whose job is to verify another's output.
#
#   "model": "claude-opus-5"      deepest. Final drafts, judgement calls, hard checks.
#   "model": "claude-sonnet-5"    the default working lane. Most tasks.
#   "model": "claude-haiku-4-5"   cheapest and fastest. Mechanical passes, smoke checks.
#
# Omit "model" and the task runs model_default below.
#
# DEPTH — set per task with engine_args:
#   "engine_args": ["--effort", "low"]    # low | medium | high | xhigh | max
#
# {spec} must stay the LAST argument: Claude Code has no --cwd flag and does not
# read the prompt from stdin. Ringer already spawns the worker with cwd set to the
# task directory and stdin closed.
# ─────────────────────────────────────────────────────────────────────────────
[engines.claude]
bin = "claude"
model_default = "claude-sonnet-5"
args_template = [
  "-p",
  "{access_args}",
  "--model",
  "{model}",
  "--output-format",
  "json",
  "{engine_args}",
  "{spec}",
]

# acceptEdits: read and write files freely, but shell commands are denied.
# A task that must shell out needs "full_access": true AND allow_full_access above.
sandbox_args = ["--permission-mode", "acceptEdits"]
full_access_args = ["--dangerously-skip-permissions"]

# Reads the top-level usage block of --output-format json. The leading cache_read
# key pins the match to the run total; without it the last match is a per-iteration
# sub-count (26 vs 268 when measured). If a future CLI reorders these keys this
# degrades to "no tokens reported", never to a wrong number.
token_regex = "\"cache_read_input_tokens\"\\s*:\\s*[0-9]+\\s*,\\s*\"output_tokens\"\\s*:\\s*([0-9]+)"
model_report_regex = "\"canonicalModel\"\\s*:\\s*\"([^\"]+)\""


[artifact]
# Self-contained HTML status page and final report, rendered from state. No model
# calls, no network. Disable with --no-artifact.
enabled = true
out = "~/.ringer/artifacts/{run_id}.html"
report_out = "~/.ringer/artifacts/{run_id}-report.html"
index_out = "~/.ringer/artifacts/index.html"
